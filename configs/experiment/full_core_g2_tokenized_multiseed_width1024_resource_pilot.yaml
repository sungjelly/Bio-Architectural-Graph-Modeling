version: 1
defaults:
  - model: g2_tokenized_width1024
  - masking: p_n_b
  - dataset: normal_core_cosmx_full_core
  - features: cosmx_full_core_morphology_edge_geometry
  - graph: k1000_r650_mutual
  - trainer: full_core_resource_pilot_2
  - evaluation: held_in_full_core_tokens_pilot_v1
  - launcher: local_single_gpu_3090

model:
  receiver_chunk_size: 256
  activation_checkpointing: true
  exact_receiver_partitioning: true

dataset:
  task: masked_expression_token_classification
  target_scale: raw_count_token_0_1_2_3plus
  tokenization:
    schema: raw_count_tokens_0_1_2_3plus_v1
    source_scale: raw_biological_probe_counts
    num_output_tokens: 4
    mask_token_id: 4
    mask_token_is_output: false
    fixed_vocabulary: true
    fit_required: false
    count_mapping:
      "0": 0
      "1": 1
      "2": 2
      "3+": 3
    output_labels:
      - zero
      - one
      - two
      - three_or_more

features:
  node_expression:
    transformed_with: raw_count_token_0_1_2_3plus_v1
    masked_values_filled_with: 0.0
    explicit_mask_channel: true
    semantic_mask_token_id: 4

masking:
  validation_replicates: 0
  test_replicates: 0
  fit_replicates: 1

trainer:
  objective: unweighted_masked_categorical_cross_entropy

campaign:
  campaign_id: cmp_20260726_full_core_g2_count_tokens_multiseed
  display_name: Full-core G2 raw-count token prediction across seeds
experiment:
  variant_label: g2_tokenized_width1024_exact_k1000_resource_pilot
  estimand: implementation_resource_feasibility_for_held_in_token_prediction
  permitted_claim: diagnostic_runtime_and_memory_feasibility_only
  conclusion_eligible: false
  excluded_from_capacity_comparison: true
classification:
  schema_version: 1
  lifecycle_stage: diagnostic
  study_axis: g2_token_width_resource_feasibility
  retention_class: retain_diagnostic_evidence
  classification_confidence: high
seed: 0
fold: 0
attempt: 1
