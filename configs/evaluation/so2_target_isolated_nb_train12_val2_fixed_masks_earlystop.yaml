evaluation:
  registry_version: 1
  task_family: target_isolated_masked_expression_negative_binomial
  protocol: donor_grouped_so2_target_isolated_nb_once_per_cell_earlystop_v1
  artifact_contract: predictive
  canonical_prediction_split: validation
  primary_metric: val/target_only_masked_negative_binomial_nll
  primary_direction: minimize
  primary_aggregation: sum_masked_entry_nll_divided_by_total_masked_entries
  splits: [validation]
  test_split_present: false
  mask_modes: [target_cell_uniform_1_1000_once]
  fixed_mask_bundle: true
  mask_seed_namespace: bagm.so2.target_isolated_nb.fixed_validation_masks.v1
  fixed_mask_realizations_per_validation_target: 1
  validation_target_visits: exactly_once
  validation_neighbor_context: fully_observed_static_cell_autonomous
  metrics:
    - train/pooled_masked_negative_binomial_nll
    - val/target_only_masked_negative_binomial_nll
    - val/unseen_donor/raw_count_mae
    - val/unseen_donor/raw_count_rmse
    - val/unseen_donor/log1p_mae
    - val/unseen_donor/log1p_rmse
    - val/unseen_donor/poisson_deviance
    - val/unseen_donor/observed_zero_rate
    - val/unseen_donor/predicted_zero_probability_mean
    - val/unseen_donor/zero_brier_score
  per_core_metrics_are_diagnostic_only: true
  uncertainty_unit: donor_group
  active_model_seeds: [0]
  independent_training_donor_groups: 6
  independent_validation_donor_groups: 1
  validation_used_for_scheduler_early_stopping_and_checkpoint_selection: true
  validation_role: model_selection_only
  generalization_estimate: false
  unbiased_test_estimate: false
  matched_protocol_comparator_required_for_superiority_claim: true
  save_fixed_prediction_checks: false
  save_full_prediction_matrices: false
  save_curve_numeric_data: true
