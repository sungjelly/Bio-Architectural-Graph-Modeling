evaluation:
  registry_version: 1
  task_family: masked_expression_hybrid_count
  protocol: held_in_pooled_10core_fixed_budget
  canonical_prediction_split: fit
  primary_metric: fit/whole_node/hybrid_loss
  primary_direction: minimize
  splits: [fit]
  mask_modes: [partial_gene, whole_node, spatial_block]
  mask_replicates_per_mode: 3
  fixed_mask_bundle: true
  mask_source: exact_regeneration_of_prior_per_core_fixed_masks
  uncertainty_unit: tissue_core
  independent_biological_replicates: 10
  technical_model_seeds: 7
  equal_core_aggregation: true
  generalization_estimate: false
  validation_or_test_selection: false
  conclusion_bearing: true
  diagnostic_only: false
  save_per_mask_numeric_data: true
  ensemble_combination: probability_and_continuous_prediction_mean
