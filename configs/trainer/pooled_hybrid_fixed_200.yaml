trainer:
  optimizer: AdamW
  learning_rate: 0.0003
  batch_size: 1
  batch_unit: one_complete_core_graph
  core_graph_batches_per_epoch: 10
  optimizer_steps_per_epoch: 10
  total_optimizer_steps: 2000
  core_order: deterministic_epoch_shuffle
  core_order_seed: 271828
  core_sampling: exactly_once_per_epoch
  core_weighting: equal
  neighbor_sampling: false
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  huber_delta: 1.0
  max_epochs: 200
  fixed_epoch_budget: true
  early_stopping: false
  early_stopping_patience: null
  validation_every: null
  precision: mixed
  amp: true
  amp_dtype: auto
  amp_requires_fp32_equivalence_smoke: true
  deterministic: true
  deterministic_warn_only: false
  restore_best: false
  monitored_metric: null
  primary_checkpoint_role: last
  checkpoint_policy: last_only
  graph_execution: sequential_complete_core_exact_no_neighbor_sampling
  objective: equal_weight_balanced_detection_ordinal_positive_huber_within_core
  resume_boundary: completed_global_epoch_only
  diagnostic_resource_pilot: false
  run_fp32_amp_equivalence: false
