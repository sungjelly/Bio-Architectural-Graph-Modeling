trainer:
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  batch_size: 2
  batch_unit: two_complete_core_target_sets_per_optimizer_update
  global_epoch_unit: every_training_cell_targeted_exactly_once_across_twelve_cores
  training_cells_per_global_epoch: 208696
  validation_cells_per_validation: 37367
  training_core_visits_per_global_epoch: 12
  validation_core_visits_per_global_epoch: 2
  cores_per_optimizer_update: 2
  optimizer_updates_per_global_epoch: 6
  target_shards_per_core: 4
  target_visit_count_per_global_epoch: 1
  mask_realizations_per_target_visit: 1
  neighbor_sampling: false
  graph_context_per_target: complete_core_static_fully_observed_neighbor_stream
  routing_execution: masked_target_query_stream_plus_static_neighbor_key_value_stream
  objective: pooled_masked_entry_full_constant_negative_binomial_nb2_nll
  objective_numerator: sum_full_constant_nb2_nll_over_masked_target_entries
  objective_denominator: globally_reduced_masked_target_entry_count_per_update
  local_ddp_loss_scale: world_size_times_local_nll_sum_divided_by_global_masked_entry_count
  aggregation_weight: masked_entries
  equal_core_or_equal_target_reweighting: false
  likelihood_compute_dtype: float32
  likelihood_outside_autocast: true
  max_epochs: 300
  minimum_global_epochs: 50
  early_stopping_patience_clock_starts_after_minimum_epoch: true
  fixed_epoch_budget: false
  optimizer_zero_grad_per_paired_core_update: 1
  optimizer_steps_per_paired_core_update: 1
  scheduler: reduce_lr_on_plateau
  scheduler_monitor: val/target_only_masked_negative_binomial_nll
  scheduler_mode: min
  scheduler_factor: 0.5
  scheduler_patience: 8
  scheduler_threshold_mode: abs
  scheduler_threshold: 0.0001
  scheduler_min_learning_rate: 0.000001
  early_stopping: true
  early_stopping_monitor: val/target_only_masked_negative_binomial_nll
  early_stopping_mode: min
  early_stopping_patience: 25
  early_stopping_min_delta: 0.0001
  validation_every: 1
  precision: mixed
  amp: true
  amp_dtype: auto
  amp_requires_fp32_equivalence_preflight: true
  deterministic: true
  deterministic_warn_only: false
  restore_best: true
  monitored_metric: val/target_only_masked_negative_binomial_nll
  primary_checkpoint_role: best
  checkpoint_policy: atomic_latest_and_best_then_final_best_only
  checkpoint_every_global_epochs: 1
  checkpoint_at_final_epoch: true
  checkpoint_final_role: validation_best
  epoch_checkpoint_archives: false
  delete_latest_after_verified_best_reload: true
  core_order_seed: 2026092602
  target_shard_seed: 2026092603
  model_step_rng_derivation: model_seed_global_epoch_update_core_alias_target_shard
  graph_execution: four_rank_ddp_each_rank_disjoint_target_shard_of_each_of_two_sequential_cores
  cores_staged_sequentially_per_optimizer_update: true
  ddp_sync_policy: first_core_backward_under_no_sync_second_core_backward_synced
  distributed_rank_assignment:
    - rank0_each_core_target_shard0
    - rank1_each_core_target_shard1
    - rank2_each_core_target_shard2
    - rank3_each_core_target_shard3
  target_coverage_gate: exactly_once_per_training_cell_per_global_epoch
  validation_target_coverage_gate: exactly_once_per_validation_cell
  nonempty_target_mask_gate: true
  unmasked_neighbor_gate: true
  return_leakage_gate: true
  stage_complete_core_graph_on_device: false
  staged_relative_geometry_dtype: float32
  maximum_simultaneously_staged_cores_per_gpu: 1
  distributed: true
  distributed_backend: nccl
  distributed_world_size: 4
  rank_zero_only_artifact_writes: true
  epoch_metrics_csv: results/epoch_metrics.csv
  per_core_metrics_csv: results/per_core_epoch_metrics.csv
  epoch_metrics_fsync: true
  record_loss_every_global_epoch: true
  record_validation_metrics_every_global_epoch: true
  record_global_gradient_cosine_every_global_epoch: true
  record_block_gradient_cosine_every_global_epoch: true
  record_inverse_dispersion_gradient_cosine_every_global_epoch: true
  persist_gradient_vectors: false
  nonfinite_policy: fail_closed
