trainer:
  learning_rate: 0.0001
  batch_size: 2
  batch_unit: two_complete_training_core_graphs_gradient_averaged_per_update
  global_epoch_unit: twelve_training_core_visits_six_optimizer_updates_plus_fixed_validation
  training_core_visits_per_global_epoch: 12
  validation_core_visits_per_global_epoch: 2
  cores_per_optimizer_update: 2
  optimizer_updates_per_global_epoch: 6
  neighbor_sampling: false
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  objective: masked_full_constant_negative_binomial_nb2_nll
  likelihood_compute_dtype: float32
  likelihood_outside_autocast: true
  max_epochs: 300
  minimum_global_epochs: 50
  early_stopping_patience_clock_starts_after_minimum_epoch: true
  fixed_epoch_budget: false
  mask_views_per_core_step: 10
  mask_views_per_rank_per_optimizer_update: 5
  mask_view_gradient_aggregation: ddp_exact_mean_of_four_rank_local_means_of_five
  optimizer_zero_grad_per_paired_core_update: 1
  optimizer_steps_per_paired_core_update: 1
  scheduler: reduce_lr_on_plateau
  scheduler_monitor: val/unseen_donor/masked_negative_binomial_nll
  scheduler_mode: min
  scheduler_factor: 0.5
  scheduler_patience: 8
  scheduler_threshold_mode: abs
  scheduler_threshold: 0.0001
  scheduler_min_learning_rate: 0.000001
  early_stopping: true
  early_stopping_monitor: val/unseen_donor/masked_negative_binomial_nll
  early_stopping_mode: min
  early_stopping_patience: 25
  early_stopping_min_delta: 0.0001
  validation_every: 1
  precision: mixed
  amp: true
  amp_dtype: auto
  amp_requires_fp32_equivalence_preflight: true
  deterministic: true
  deterministic_warn_only: false
  restore_best: true
  monitored_metric: val/unseen_donor/masked_negative_binomial_nll
  primary_checkpoint_role: best
  checkpoint_policy: atomic_latest_and_best_then_final_best_only
  checkpoint_every_global_epochs: 1
  checkpoint_at_final_epoch: true
  checkpoint_final_role: validation_best
  epoch_checkpoint_archives: false
  delete_latest_after_verified_best_reload: true
  core_order_seed: 2026082402
  model_step_rng_derivation: model_seed_global_epoch_update_core_alias_view
  graph_execution: four_rank_ddp_one_complete_core_per_gpu_exact
  stage_complete_core_graph_on_device: true
  staged_relative_geometry_dtype: float16
  distributed: true
  distributed_backend: nccl
  distributed_world_size: 4
  distributed_rank_assignment:
    - core_a_views_0_4
    - core_a_views_5_9
    - core_b_views_0_4
    - core_b_views_5_9
  maximum_simultaneously_staged_cores_per_gpu: 1
  rank_zero_only_artifact_writes: true
  epoch_metrics_csv: results/epoch_metrics.csv
  per_core_metrics_csv: results/per_core_epoch_metrics.csv
  epoch_metrics_fsync: true
  nonfinite_policy: fail_closed
