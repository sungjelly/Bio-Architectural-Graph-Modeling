  receiver_chunk_size: 64
  max_edges_per_chunk: 200000
  activation_checkpointing: true
  exact_receiver_partitioning: true
  implicit_self_loops: false
  trainable_node_identifiers: false
  trainable_edge_identifiers: false
  uses_graph_inputs: false
  uses_edge_inputs: false
  parameter_match_reference: edge_aware_qkv_graph_transformer
  parameter_matching_method: repurpose_qkv_and_edge_parameters_as_within_cell_routing
  comparison_target: qkv_gat_same_data_masks_width_depth_seed_optimizer_and_budget
