model:
  name: qkv-gat-matched-self
  family: qkv_parameter_matched_self_control
  embedding_dim: 704
  hidden_dim: 704
  graph_layers: 8
  attention_heads: 11
  attention_head_dim: 64
  ffn_dim: 2816
  decoder_dim: 2816
