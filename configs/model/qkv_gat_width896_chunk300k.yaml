model:
  name: qkv-gat
  family: edge_aware_qkv_graph_transformer
  embedding_dim: 896
  hidden_dim: 896
  graph_layers: 8
  attention_heads: 14
  attention_head_dim: 64
  ffn_dim: 3584
  decoder_dim: 3584
  edge_hidden_dim: 256
  edge_embedding_dim: 128
  edge_conditioning_mode: bias_gate
  dropout: 0.0
  attention_dropout: 0.0
  receiver_chunk_size: 64
  max_edges_per_chunk: 300000
  activation_checkpointing: true
  exact_receiver_partitioning: true
  implicit_self_loops: false
  trainable_node_identifiers: false
  trainable_edge_identifiers: false
  uses_graph_inputs: true
  uses_edge_inputs: true
