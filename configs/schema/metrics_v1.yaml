        direction: minimize
        unit: equal_weight_hurdle_objective
      fit/whole_node/detection_bce:
        direction: minimize
        unit: balanced_binary_cross_entropy
      fit/whole_node/positive_continuous_huber:
        direction: minimize
        unit: standardized_log1p_positive_targets
      fit/whole_node/detection_balanced_accuracy:
        direction: maximize
        unit: proportion
      fit/whole_node/detection_sensitivity:
        direction: maximize
        unit: proportion
      fit/whole_node/detection_specificity:
        direction: maximize
        unit: proportion
      fit/whole_node/state8_exact_accuracy:
        direction: descriptive
        unit: proportion
      fit/whole_node/state8_balanced_accuracy:
        direction: maximize
        unit: proportion
      fit/whole_node/positive_count_state_exact_accuracy:
        direction: maximize
        unit: proportion_of_positive_targets
      fit/whole_node/positive_count_state_mae:
        direction: minimize
        unit: positive_count_state
      fit/whole_node/positive_count_state_within_one_accuracy:
        direction: maximize
        unit: proportion_of_positive_targets
      fit/whole_node/positive_continuous_mae:
        direction: minimize
        unit: standardized_log1p_positive_targets
      fit/whole_node/reconstructed_count_log1p_mae:
        direction: minimize
        unit: log1p_raw_count
      fit/whole_node/reference_per_gene_positive_count_state_mae:
        direction: descriptive
        unit: positive_count_state
      fit/whole_node/reference_per_gene_positive_continuous_huber:
        direction: descriptive
        unit: standardized_log1p_positive_targets
      fit/whole_node/reference_per_gene_detection_balanced_accuracy:
        direction: descriptive
        unit: proportion

  classification:
    active_in_current_project: false
    activation_rule: Use only for a declared classification outcome; never derive these from masked-expression regression.
    metrics:
      val/auroc:
        direction: maximize
        definition: Area under the receiver-operating-characteristic curve.
      val/auprc:
        direction: maximize
        definition: Area under the precision-recall curve; report class prevalence.
      val/sensitivity:
        direction: maximize
        definition: Recall for the prespecified positive class at a locked threshold.
      val/specificity:
        direction: maximize
        definition: True-negative rate at a locked threshold.
      val/balanced_accuracy:
        direction: maximize
        definition: Mean class recall at a locked threshold.
      val/macro_f1:
        direction: maximize
        definition: Unweighted mean of class-specific F1 values.
      val/per_class_precision:
        direction: maximize
        storage: metrics/per_class.json
      val/per_class_recall:
        direction: maximize
        storage: metrics/per_class.json
      val/per_class_f1:
        direction: maximize
        storage: metrics/per_class.json
      calibration/brier:
        direction: minimize
        definition: Mean squared error of probabilistic predictions.
      calibration/expected_calibration_error:
        direction: minimize
        definition: Prespecified binning-based calibration error with bin definition stored in metadata.
      test/auroc:
        direction: maximize
        applicable_when: test_thresholds_and_model_are_locked
      external/auroc:
        direction: maximize
        applicable_when: an_external_classification_dataset_is_declared

  survival:
    active_in_current_project: false
    activation_rule: Use only when a survival endpoint, censoring policy, and time grid are declared.
    metrics:
      val/concordance_index:
        direction: maximize
      val/integrated_brier_score:
        direction: minimize
      val/time_dependent_auroc:
        direction: maximize
        storage: metrics/events.jsonl
        metadata_required:
          - evaluation_time
          - censoring_estimator

diagnostic_families:
  stability:
    fields:
      - primary_mean
      - primary_std
      - primary_min
      - primary_max
      - n_completed_runs
    rule: Summarize all prespecified seeds and folds; never select only the best seed.

  generalization:
    metrics:
      generalization/train_to_validation_gap:
        definition: validation_metric_minus_train_metric_after_matching_scale_and_direction
      generalization/validation_to_external_gap:
        definition: external_metric_minus_validation_metric_after_matching_scale_and_direction
        applicable_when: an_external_dataset_is_declared

  efficiency:
    metrics:
      resource/training_duration_seconds:
        direction: minimize
      resource/inference_duration_seconds:
        direction: minimize
      resource/total_duration_seconds:
        direction: minimize
      resource/samples_per_second:
        direction: maximize
      resource/peak_vram_gb:
        direction: minimize
      resource/parameter_count:
        direction: minimize_conditioned_on_predictive_utility
      resource/checkpoint_size_bytes:
        direction: minimize

  graph:
    metrics:
      graph/node_count_mean:
        direction: descriptive
      graph/node_count_distribution:
        direction: descriptive
        storage: diagnostics/graph_statistics.json
      graph/edge_count_mean:
        direction: descriptive
      graph/edge_count_distribution:
        direction: descriptive
        storage: diagnostics/graph_statistics.json
      graph/isolated_node_rate:
        direction: minimize
      graph/disconnected_component_rate:
        direction: minimize
      graph/degree_mean:
        direction: descriptive
      graph/degree_p95:
        direction: descriptive
      graph/effective_neighbor_count:
        direction: descriptive
      graph/construction_duration_seconds:
        direction: minimize

  features:
    metrics:
      feature/missing_node_feature_rate:
        direction: minimize
      feature/missing_edge_feature_rate:
        direction: minimize
        applicable_when: edge_features_are_enabled
      feature/embedding_norm_mean:
        direction: descriptive
      feature/embedding_norm_std:
        direction: descriptive

  masking:
    metrics:
      mask/requested_rate:
        direction: descriptive
      mask/effective_rate:
        direction: target_requested_rate
      mask/masked_node_count:
        direction: descriptive
      mask/masked_edge_count:
        direction: descriptive
      mask/class_distribution_shift:
        direction: minimize
        applicable_when: a_classification_label_is_declared

variant_aggregation:
  schema_version: 1
  required_fields:
    - repro_id
    - n_expected_runs
    - n_completed_runs
    - n_failed_runs
    - primary_mean
    - primary_std
    - primary_min
    - primary_max
    - auprc_mean
    - brier_mean
    - median_duration
    - maximum_peak_vram
    - best_run_id
    - worst_run_id
  nullable_when_not_applicable:
    - auprc_mean
    - brier_mean
  ranking_rule: Rank complete prespecified variant aggregates, never an individual favorable seed.
  selection_score:
    enabled: false
    rule: If introduced, name it selection_score and store the complete formula and version.
