      fit/whole_node/baseline_per_gene_modal_balanced_accuracy_percent:
        direction: descriptive
        unit: percent
      fit/whole_node/baseline_per_gene_modal_nonzero_accuracy_percent:
        direction: descriptive
        unit: percent
      fit/whole_node/token_0_recall_percent:
        direction: maximize
        unit: percent
      fit/whole_node/token_1_recall_percent:
        direction: maximize
        unit: percent
      fit/whole_node/token_2_recall_percent:
        direction: maximize
        unit: percent
      fit/whole_node/token_3_recall_percent:
        direction: maximize
        unit: percent

      fit/partial_gene/masked_token_cross_entropy:
        description: Unweighted categorical cross-entropy over masked partial-gene output tokens.
        direction: minimize
        unit: nats_per_masked_token
      fit/partial_gene/masked_token_accuracy_percent:
        direction: maximize
        unit: percent_of_masked_tokens
      fit/partial_gene/masked_token_balanced_accuracy_percent:
        direction: maximize
