schema_name: bagm_metric_registry
schema_version: 1
created_at_utc: "2026-07-24"

naming:
  separator: /
  required_pattern: "^[a-z][a-z0-9_]*(/[a-z][a-z0-9_]*)+$"
  prohibited_ambiguous_names:
    - score
    - accuracy
    - result
    - final_metric
  parameter_fields_are_not_metrics:
    - model_family
    - masking_type
    - dataset_id
    - use_edge_features
    - embedding_dim
    - neighbor_k

task_families:
  masked_expression_regression:
    active_in_current_project: true
    primary_metric: val/masked_huber
    primary_direction: minimize
    independent_uncertainty_unit: spatial_macroblock
    masked_r2_contract:
      definition: 1 - sum_squared_error / sum_squared_deviation_from_the_same_finite_masked_target_mean
      scope: flat_across_finite_masked_entries_on_the_declared_modeled_expression_scale
      negative_values: retained_without_clipping
      zero_target_variance: undefined
      fixed_mask_aggregation: unweighted_arithmetic_mean_of_replicate_level_masked_r2_within_mask_mode
      percentage_reconciliation: 100 * aggregate_masked_r2
      interpretation: percent_variance_explained_not_classification_accuracy
    metrics:
      fit/whole_node/masked_huber:
        description: Held-in whole-node masked Huber loss for an explicitly transductive full-core fixed-budget capacity protocol.
        direction: minimize
        unit: full_core_fitted_standardized_log1p_expression
        applicable_when: evaluation_protocol_is_held_in_full_core_fixed_budget
      fit/partial_gene/masked_huber:
        description: Held-in partial-gene masked Huber loss; descriptive only.
        direction: minimize
        unit: full_core_fitted_standardized_log1p_expression
      fit/partial_gene/log1p_cp10k_masked_huber:
        description: Held-in partial-gene masked Huber loss after full-cell CP10k normalization and log1p transformation; descriptive only.
        direction: minimize
        unit: full_cell_log1p_cp10k_expression
        applicable_when: evaluation_protocol_is_explicitly_held_in_and_hidden_entries_contribute_to_the_library_size_denominator
      fit/spatial_block/masked_huber:
        description: Held-in spatial-block masked Huber loss; descriptive only.
        direction: minimize
        unit: full_core_fitted_standardized_log1p_expression
      fit/whole_node/masked_mse:
        direction: minimize
        unit: squared_full_core_fitted_standardized_log1p_expression
      fit/partial_gene/masked_mse:
        direction: minimize
        unit: squared_full_core_fitted_standardized_log1p_expression
      fit/spatial_block/masked_mse:
        direction: minimize
        unit: squared_full_core_fitted_standardized_log1p_expression
      fit/whole_node/masked_mae:
        direction: minimize
        unit: full_core_fitted_standardized_log1p_expression
      fit/partial_gene/masked_mae:
        direction: minimize
        unit: full_core_fitted_standardized_log1p_expression
      fit/spatial_block/masked_mae:
        direction: minimize
        unit: full_core_fitted_standardized_log1p_expression
      fit/whole_node/masked_r2:
        description: Flat masked R-squared on one held-in whole-node mask replicate; negative values are valid and zero target variance is undefined.
        direction: maximize
        unit: proportion_of_masked_target_variance_relative_to_masked_target_mean
        applicable_when: evaluation_protocol_is_held_in_full_core_fixed_budget
      fit/partial_gene/masked_r2:
        description: Flat masked R-squared on one held-in partial-gene mask replicate; descriptive only.
        direction: maximize
        unit: proportion_of_masked_target_variance_relative_to_masked_target_mean
      fit/spatial_block/masked_r2:
        description: Flat masked R-squared on one held-in spatial-block mask replicate; descriptive only.
        direction: maximize
        unit: proportion_of_masked_target_variance_relative_to_masked_target_mean
      fit/whole_node/masked_percent_variance_explained:
        description: Exactly 100 times the replicate-mean held-in whole-node masked R-squared; may be negative and is not classification accuracy.
        direction: maximize
        unit: percent_of_masked_target_variance_relative_to_masked_target_mean
        reconciliation: 100 * fit/whole_node/masked_r2
      fit/partial_gene/masked_percent_variance_explained:
        description: Exactly 100 times the replicate-mean held-in partial-gene masked R-squared; descriptive only.
        direction: maximize
        unit: percent_of_masked_target_variance_relative_to_masked_target_mean
        reconciliation: 100 * fit/partial_gene/masked_r2
      fit/spatial_block/masked_percent_variance_explained:
        description: Exactly 100 times the replicate-mean held-in spatial-block masked R-squared; descriptive only.
        direction: maximize
        unit: percent_of_masked_target_variance_relative_to_masked_target_mean
        reconciliation: 100 * fit/spatial_block/masked_r2
      fit/whole_node/gene_pearson_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/partial_gene/gene_pearson_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/spatial_block/gene_pearson_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/whole_node/gene_spearman_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/partial_gene/gene_spearman_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/spatial_block/gene_spearman_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/whole_node/cell_pearson_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/partial_gene/cell_pearson_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/spatial_block/cell_pearson_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/whole_node/cell_spearman_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/partial_gene/cell_spearman_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/spatial_block/cell_spearman_mean:
        direction: maximize
        unit: descriptive_correlation
      fit/training/final_masked_huber:
        direction: minimize
        unit: epoch_specific_training_mask
      fit/training/min_observed_masked_huber:
        direction: descriptive
        unit: epoch_specific_training_mask
      fit/training/last_20_epoch_loss_slope:
        direction: descriptive
        unit: loss_per_epoch
      val/masked_huber:
        description: Mean Huber loss over finite masked expression entries.
        direction: minimize
        unit: standardized_log1p_expression
        required: true
      val/masked_mse:
        description: Mean squared error over finite masked expression entries.
        direction: minimize
        unit: squared_standardized_log1p_expression
      val/masked_mae:
        description: Mean absolute error over finite masked expression entries.
        direction: minimize
        unit: standardized_log1p_expression
      val/masked_r2:
        description: Flat masked R-squared against the mean of the same finite masked validation targets; negative values are valid and zero target variance is undefined.
        direction: maximize
        unit: proportion_of_masked_target_variance_relative_to_masked_target_mean
      val/masked_percent_variance_explained:
        description: Exactly 100 times validation masked R-squared; may be negative and is not classification accuracy.
        direction: maximize
        unit: percent_of_masked_target_variance_relative_to_masked_target_mean
        reconciliation: 100 * val/masked_r2
      test/masked_huber:
        description: Sealed-test masked Huber loss, evaluated only after lock.
        direction: minimize
        unit: standardized_log1p_expression
      test/masked_r2:
        description: Flat masked R-squared against the mean of the same finite masked sealed-test targets.
        direction: maximize
        unit: proportion_of_masked_target_variance_relative_to_masked_target_mean
      test/masked_percent_variance_explained:
        description: Exactly 100 times sealed-test masked R-squared; may be negative and is not classification accuracy.
        direction: maximize
        unit: percent_of_masked_target_variance_relative_to_masked_target_mean
        reconciliation: 100 * test/masked_r2
      external/masked_huber:
        description: Masked Huber loss in an independently declared external dataset.
        direction: minimize
        unit: standardized_log1p_expression
        applicable_when: an_external_dataset_is_declared
      external/masked_r2:
        description: Flat masked R-squared against the mean of the same finite masked external targets.
        direction: maximize
        unit: proportion_of_masked_target_variance_relative_to_masked_target_mean
        applicable_when: an_external_dataset_is_declared
      external/masked_percent_variance_explained:
        description: Exactly 100 times external masked R-squared; may be negative and is not classification accuracy.
        direction: maximize
        unit: percent_of_masked_target_variance_relative_to_masked_target_mean
        reconciliation: 100 * external/masked_r2
        applicable_when: an_external_dataset_is_declared
      val/gene_pearson:
        description: Gene-wise Pearson correlation summarized without treating genes or cells as biological replicates.
        direction: maximize
        unit: correlation
      val/gene_spearman:
        description: Gene-wise Spearman correlation summarized without treating genes or cells as biological replicates.
        direction: maximize
        unit: correlation
      val/cell_pearson:
        description: Cell-wise Pearson correlation, reported as a descriptive distribution.
        direction: maximize
        unit: correlation
      val/cell_spearman:
        description: Cell-wise Spearman correlation, reported as a descriptive distribution.
        direction: maximize
        unit: correlation
      val/negative_log_likelihood:
        description: Predictive negative log likelihood.
        direction: minimize
        applicable_when: the_model_has_a_prespecified_valid_likelihood
      val/deviance:
        description: Predictive deviance under the declared observation model.
        direction: minimize
        applicable_when: the_model_has_a_prespecified_valid_likelihood
      calibration/interval_coverage:
        description: Empirical predictive-interval coverage at the declared nominal level.
        direction: target
        applicable_when: calibrated_predictive_intervals_are_available
      calibration/interval_width:
        description: Mean predictive-interval width at the declared nominal level.
        direction: minimize_conditioned_on_coverage
        applicable_when: calibrated_predictive_intervals_are_available

  masked_expression_token_classification:
    active_in_current_project: true
    primary_metric: fit/whole_node/masked_token_accuracy_percent
    primary_direction: maximize
    independent_uncertainty_unit: single_spatial_core
    tokenization_schema: raw_count_tokens_0_1_2_3plus_v1
    token_contract:
      output_tokens: [0, 1, 2, 3]
      raw_count_mapping:
        "0": 0
        "1": 1
        "2": 2
        "3+": 3
      mask_input_token: 4
      mask_input_token_is_output_class: false
      fixed_vocabulary: true
      percentages_are_on_0_to_100_scale: true
      interpretation: held_in_transductive_masked_token_reconstruction_not_validation_or_test_accuracy
    metrics:
      fit/whole_node/masked_token_cross_entropy:
        description: Unweighted categorical cross-entropy over masked whole-node output tokens.
        direction: minimize
        unit: nats_per_masked_token
      fit/whole_node/masked_token_accuracy_percent:
        description: Exact output-token matches over masked whole-node entries, multiplied by 100.
        direction: maximize
        unit: percent_of_masked_tokens
        applicable_when: evaluation_protocol_is_held_in_full_core_fixed_budget
      fit/whole_node/masked_token_balanced_accuracy_percent:
        description: Unweighted mean recall of output tokens 0 through 3 on masked whole-node entries, multiplied by 100.
        direction: maximize
        unit: percent
      fit/whole_node/masked_nonzero_token_accuracy_percent:
        description: Exact matches restricted to masked whole-node targets in output tokens 1 through 3, multiplied by 100.
        direction: maximize
        unit: percent_of_masked_nonzero_tokens
