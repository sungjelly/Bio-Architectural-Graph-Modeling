  masked_expression_negative_binomial:
    active_in_current_project: true
    primary_metric: val/unseen_donor/masked_negative_binomial_nll
    primary_direction: minimize
    independent_uncertainty_unit: donor_group
    likelihood_contract:
      family: negative_binomial_nb2
      expectation: mu
      variance: mu_plus_mu_squared_over_theta
      full_likelihood_constants_included: true
      aggregation: equal_mask_view_within_core_then_equal_validation_core
      validation_masks_fixed_across_epochs: true
      validation_used_for_model_selection: true
      test_partition_present: false
    metrics:
      train/masked_negative_binomial_nll:
        description: Full-constant NB2 NLL on stochastic masked raw-count training entries.
        direction: minimize
        unit: nats_per_masked_count
      val/unseen_donor/masked_negative_binomial_nll:
        description: Equal-view, equal-core full-constant NB2 NLL on fixed masks from the held-out validation donor pair.
        direction: minimize
        unit: nats_per_masked_count
      val/unseen_donor/pooled_masked_negative_binomial_nll:
        description: Entry-pooled full-constant NB2 NLL on the same fixed held-out validation masks.
        direction: minimize
        unit: nats_per_masked_count
      val/unseen_donor/raw_count_mae:
        direction: minimize
        unit: raw_counts
      val/unseen_donor/raw_count_rmse:
        direction: minimize
        unit: raw_counts
      val/unseen_donor/log1p_mae:
        direction: minimize
        unit: log1p_raw_counts
      val/unseen_donor/log1p_rmse:
        direction: minimize
        unit: log1p_raw_counts
      val/unseen_donor/poisson_deviance:
        direction: minimize
        unit: deviance_per_masked_count
      val/unseen_donor/observed_zero_rate:
        direction: descriptive
        unit: proportion
      val/unseen_donor/predicted_zero_probability_mean:
        direction: descriptive
        unit: probability
      val/unseen_donor/zero_brier_score:
        direction: minimize
        unit: squared_probability_error

  masked_expression_hybrid_count:
    active_in_current_project: true
    primary_metric: fit/whole_node/hybrid_loss
    primary_direction: minimize
    independent_uncertainty_unit: spatial_tissue_core
    representation_schema: hybrid_raw_count_0_1_2_3_4_7_8_15_16_31_32plus_v1
    loss_contract:
      detection: equal_mean_zero_and_positive_bce
      ordinal: equal_mean_below_or_equal_and_above_bce_per_positive_threshold
      positive_continuous: huber_delta_1_on_per_gene_standardized_log1p
      total: equal_mean_of_the_three_components
      absent_expected_stratum: fail
    metrics:
      fit/whole_node/hybrid_loss:
        description: Equal-weight balanced detection, positive ordinal, and positive continuous loss on held-in whole-node masks.
        direction: minimize
        unit: equal_weight_hybrid_objective
      fit/partial_gene/hybrid_loss:
        direction: minimize
        unit: equal_weight_hybrid_objective
      fit/spatial_block/hybrid_loss:
        direction: minimize
        unit: equal_weight_hybrid_objective
      fit/whole_node/detection_bce:
        direction: minimize
        unit: balanced_binary_cross_entropy
      fit/whole_node/ordinal_bce:
        direction: minimize
        unit: balanced_cumulative_binary_cross_entropy
      fit/whole_node/positive_continuous_huber:
        direction: minimize
        unit: standardized_log1p_positive_targets
      fit/whole_node/detection_balanced_accuracy:
        direction: maximize
        unit: proportion
      fit/whole_node/detection_sensitivity:
        direction: maximize
        unit: proportion
      fit/whole_node/detection_specificity:
        direction: maximize
        unit: proportion
      fit/whole_node/detection_precision:
        direction: maximize
        unit: proportion
      fit/whole_node/state8_exact_accuracy:
        direction: descriptive
        unit: proportion
      fit/whole_node/state8_balanced_accuracy:
        direction: maximize
        unit: proportion
      fit/whole_node/positive_state_exact_accuracy:
        direction: maximize
        unit: proportion_of_positive_targets
      fit/whole_node/positive_ordinal_mae:
        direction: minimize
        unit: positive_count_state
      fit/whole_node/positive_within_one_state_accuracy:
        direction: maximize
        unit: proportion_of_positive_targets
      fit/whole_node/positive_continuous_mae:
        direction: minimize
        unit: standardized_log1p_positive_targets
      fit/whole_node/reconstructed_count_log1p_mae:
        direction: minimize
        unit: log1p_raw_count
      fit/whole_node/collapsed4_exact_accuracy:
        direction: descriptive
        unit: proportion
      fit/whole_node/collapsed4_balanced_accuracy:
        direction: descriptive
        unit: proportion
      fit/whole_node/reference_per_gene_positive_ordinal_mae:
        direction: descriptive
        unit: positive_count_state
      fit/whole_node/reference_per_gene_positive_continuous_huber:
        direction: descriptive
        unit: standardized_log1p_positive_targets
      fit/whole_node/reference_per_gene_detection_balanced_accuracy:
        direction: descriptive
        unit: proportion

  masked_expression_hurdle_count:
    active_in_current_project: true
    primary_metric: fit/whole_node/hurdle_loss
    primary_direction: minimize
    independent_uncertainty_unit: spatial_tissue_core
    representation_schema: hurdle_detection_plus_positive_standardized_log1p_v1
    loss_contract:
      detection: equal_mean_zero_and_positive_bce
      positive_continuous: huber_delta_1_on_per_gene_standardized_log1p
      total: equal_mean_of_the_two_components
      absent_expected_stratum: fail
    metrics:
      fit/whole_node/hurdle_loss:
        description: Equal-weight balanced detection and positive continuous loss on held-in whole-node masks.
        direction: minimize
