[program:bagm_so12_paper_test_leiden]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/bagm-so12-paper-test-leiden.sh
directory=/workspace/BAGM
autostart=false
autorestart=false
startsecs=2
startretries=0
stopsignal=TERM
stopwaitsecs=1800
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
