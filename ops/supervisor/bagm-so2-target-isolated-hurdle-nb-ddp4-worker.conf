[program:bagm_so2_target_isolated_hurdle_nb_ddp4_worker]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/bagm-so2-target-isolated-hurdle-nb-ddp4-worker.sh
directory=/workspace/BAGM-relative-qkv-analysis
autostart=false
