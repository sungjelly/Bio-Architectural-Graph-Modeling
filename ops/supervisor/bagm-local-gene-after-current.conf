[program:bagm_local_gene_after_current]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/bagm-local-gene-early-stopping.sh --handoff --plan /workspace/BAGM/state/handoffs/local_gene_early_stopping/plan.json
directory=/workspace/BAGM-relative-qkv-analysis
autostart=false
autorestart=false
startsecs=2
startretries=0
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
