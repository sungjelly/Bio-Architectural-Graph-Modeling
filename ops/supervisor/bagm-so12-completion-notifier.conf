[program:bagm_so12_completion_notifier]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/bagm-so12-completion-notifier.sh
directory=/workspace/BAGM
autostart=true
autorestart=unexpected
startsecs=0
startretries=3
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
