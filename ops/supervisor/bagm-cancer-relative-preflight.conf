[program:bagm_cancer_relative_preflight]
environment=PROC_NAME="%(program_name)s",CUDA_VISIBLE_DEVICES="0"
command=/opt/supervisor-scripts/bagm-cancer-relative-preflight.sh
directory=/workspace/BAGM
autostart=false
autorestart=false
startsecs=0
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
