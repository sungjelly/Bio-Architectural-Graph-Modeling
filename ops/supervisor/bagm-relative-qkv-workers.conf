[program:bagm_relative_qkv]
process_name=%(program_name)s_gpu%(process_num)02d
numprocs=1
numprocs_start=0
environment=PROC_NAME="%(program_name)s_gpu%(process_num)02d"
command=/opt/supervisor-scripts/bagm-relative-qkv-worker.sh %(process_num)s
directory=/workspace/BAGM
autostart=false
autorestart=unexpected
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
