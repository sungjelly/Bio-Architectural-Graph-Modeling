[program:bagm_so12_cancer_leiden]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/bagm-so12-cancer-comparison.sh leiden
directory=/workspace/BAGM
autostart=false
autorestart=false
startsecs=2
startretries=0
stopsignal=TERM
