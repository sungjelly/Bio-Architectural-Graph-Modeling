[program:bagm_so1_after_so2_handoff]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/bagm-so1-after-so2-handoff.sh
directory=/workspace/BAGM-relative-qkv-analysis
autostart=false
autorestart=false
startsecs=2
startretries=0
stopsignal=TERM
stopwaitsecs=1800
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
