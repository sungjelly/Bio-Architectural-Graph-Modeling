[program:bagm_so12_relative_qkv_preflight]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/bagm-so12-relative-qkv-preflight.sh
directory=/workspace/BAGM
autostart=false
autorestart=false
startsecs=0
startretries=0
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
