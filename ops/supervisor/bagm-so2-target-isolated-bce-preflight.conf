[program:bagm_so2_target_isolated_bce_preflight]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/bagm-so2-target-isolated-bce-preflight.sh
directory=/workspace/BAGM-relative-qkv-analysis
autostart=false
autorestart=false
startsecs=1
startretries=0
stopsignal=TERM
stopwaitsecs=1800
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
