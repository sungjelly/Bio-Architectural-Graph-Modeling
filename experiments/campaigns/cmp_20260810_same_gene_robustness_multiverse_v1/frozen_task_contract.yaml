      cross_fov_edge_count_must_be_positive: true
      permuted_degree_equals_observed_near_degree: true
    seeds: 5
    folds: 4
    process_jobs: 20
  - id: V2
    name: full_qc_pass_retrain
    tier: primary
    graph_scope: within_fov
    cell_policy: qc_pass_receiver_and_source_before_graph_build
    qc_field: qcCellsPassed
    expression: log1p_raw_count
    residualization: none
    geometry_component_and_fold_assignment_unchanged: true
    permuted_degree_equals_observed_near_degree: true
    seeds: 5
    folds: 4
    process_jobs: 20
  - id: V3
    name: log_cp10k
    tier: primary
    graph_scope: within_fov
    cell_policy: all_matched_degree_eligible
    expression:
      formula: log1p(10000 * count_gene / max(sum_1000_panel_counts, 1))
      denominator_gene_axis: frozen_ordered_1000_probe_panel
      apply_before_neighbor_aggregation: true
      zero_library_denominator_floor: 1
    residualization: none
    seeds: 5
    folds: 4
    process_jobs: 20
  - id: V4
    name: train_only_library_size_residual
    tier: primary
    graph_scope: within_fov
    cell_policy: all_matched_degree_eligible
    expression: log1p_raw_count
    residualization:
      covariate: log1p(sum_1000_panel_counts)
      fit: per_gene_component_equal_weighted_least_squares
      tuning_fit_population: tuning_train_only
      final_fit_population: final_train_only
      apply_to: [receiver_target, source_profile_before_neighbor_mean]
      receiver_covariate_is_model_input: false
      claim: conditional_expression_deviation
    seeds: 5
    folds: 4
    process_jobs: 20
  - id: V5
    name: conservative_combined
    tier: primary
    graph_scope: within_geometry_component_across_fov
    permutation_mapping_scope: original_source_fov
    cell_policy: qc_pass_receiver_and_source_before_graph_build
    expression:
      formula: log1p(10000 * count_gene / max(sum_1000_panel_counts, 1))
      apply_before_neighbor_aggregation: true
    residualization: none
    invariants:
      cross_component_edge_count: 0
      permuted_degree_equals_observed_near_degree: true
    seeds: 5
    folds: 4
    process_jobs: 20
  - id: V6
    name: train_only_cell_state_and_library_residual
    tier: mechanistic_secondary
    graph_scope: within_fov
    cell_policy: all_matched_degree_eligible
    expression: log1p_raw_count
    residualization:
      design: vendor_cell_type_fixed_effects_plus_log1p_panel_total
      cell_type_levels_expected: 12
      fit: per_gene_component_equal_weighted_least_squares
      tuning_fit_population: tuning_train_only
      final_fit_population: final_train_only
      apply_to: [receiver_target, source_profile_before_neighbor_mean]
      receiver_cell_type_or_library_is_model_input: false
      training_coverage_rule: every_frozen_cell_type_level_must_occur_in_training
      missing_training_level_action: fail_closed
      observed_preparation_all_splits_contain_all_12_levels: true
      claim: within_vendor_type_library_adjusted_expression_deviation
    seeds: 5
    folds: 4
    process_jobs: 20

