pair_evidence:
  - genes: [COL1A1, COL3A1]
    classification: direct ECM crosslink and functional coupling
    summary: Type I and III collagen molecules occupy shared fibrils and can form intermolecular covalent crosslinks; Col3a1 loss disrupts collagen-I fibrillogenesis.
    direct_relationship: Crosslinked alpha-1(I) and alpha-1(III) peptides were isolated from native tissues, supporting a direct assembled-fibril relationship.
    shared_program_or_pathway: Both are fibrillar-collagen components of fibroblast extracellular-matrix programs.
    coexpression_or_cell_state: Coordinated expression is reported in many fibroblast-containing tissues but is not universal across all collagen-producing cell types.
    perturbational_evidence: Col3a1 gene inactivation caused abnormal collagen-I fibrillogenesis across multiple organs.
    gastric_specific_evidence: The direct biochemical and knockout evidence is not gastric-specific.
    limitations: This evidence does not validate transcriptional direction, the Jacobian sign, or a gastric graph-mediated mechanism.
    source_ids: [collagen_i_iii_crosslink_1982, col3a1_knockout_1997]

  - genes: [KRT8, KRT19]
    classification: direct alternative keratin-filament partnership
    summary: KRT8 and KRT19 can form type-II/type-I heterodimers and filament arrays; KRT8 expression stabilizes KRT19.
    direct_relationship: Cellular and recombinant experiments support K8-K19 filament formation.
    shared_program_or_pathway: Both belong to the simple and glandular epithelial intermediate-filament program.
    coexpression_or_cell_state: Both stain normal gastric epithelial compartments and are common in gastric carcinomas.
    perturbational_evidence: Introducing K8 stabilized endogenous K19 and generated K8-K19 filaments.
    gastric_specific_evidence: Gastric immunohistochemistry supports shared epithelial localization but did not calculate pairwise correlation or test direction.
    limitations: The papers do not establish a KRT19-to-KRT8 regulatory effect or spatial graph dependence in this cohort.
    source_ids: [k8_k19_filaments_1998, gastric_keratin_ihc_2004]

  - genes: [KRT8, KRT18]
    classification: direct heterodimer complex
    summary: KRT8 and KRT18 are the canonical type-II/type-I coiled-coil keratin heterodimer and assemble into epithelial intermediate filaments.
    direct_relationship: Site-specific crosslinking and recombinant assembly establish direct heterodimeric structure.
    shared_program_or_pathway: They form a core simple-epithelial keratin program.
    coexpression_or_cell_state: Both are highly prevalent in gastric mucosa and gastric carcinoma, and independent tissue profiles show coordinated expression.
    perturbational_evidence: Either protein alone was unstable, whereas coexpression stabilized both and rescued filament formation.
    gastric_specific_evidence: The gastric study demonstrates high prevalence and shared compartments, not pairwise dependence.
    limitations: Strong structural biology does not validate the model's derivative magnitude or direction in gastric tissue.
    source_ids: [k8_k18_structure_1990, k8_k18_stabilization_1989, gastric_keratin_ihc_2004]

  - genes: [KRT18, KRT19]
    classification: shared epithelial program and functional redundancy; no direct dimer
    summary: KRT18 and KRT19 are coexpressed type-I keratins with compensatory epithelial functions, but canonical keratin heterodimers require a type-II partner such as KRT8.
    direct_relationship: No convincing direct K18-K19 heterodimer evidence was found; both are type-I chains and may coexist in a K8-containing network.
    shared_program_or_pathway: Both mark simple epithelial intermediate-filament states.
    coexpression_or_cell_state: Both are frequent in normal gastric epithelium and gastric carcinoma.
    perturbational_evidence: Single K18 or K19 loss was compensated, while double knockout removed early keratin filaments and caused trophoblast fragility and embryonic lethality.
    gastric_specific_evidence: Gastric immunohistochemistry supports shared epithelial-state abundance but not a pairwise correlation coefficient.
    limitations: Functional redundancy is not a direct physical interaction and does not validate either signed Jacobian direction.
    source_ids: [k18_k19_double_knockout_2000, gastric_keratin_ihc_2004]

  - genes: [COL1A1, COL1A2]
    classification: direct molecular complex
    summary: Normal type-I collagen is a heterotrimer containing two alpha-1(I) chains and one alpha-2(I) chain.
    direct_relationship: Structural and mutational analysis identifies the chain interfaces responsible for COL1A1-COL1A2 heterotrimerization.
    shared_program_or_pathway: Both are obligatory components of the type-I collagen fibril program.
    coexpression_or_cell_state: Their transcripts are coordinated across examined developmental regions.
    perturbational_evidence: Interface mutations altered homo- versus heterotrimer assembly in the structural study.
    gastric_specific_evidence: The molecular-complex evidence is general rather than gastric-specific.
    limitations: Stoichiometric assembly does not establish transcriptional regulation or a graph-mediated effect.
    source_ids: [collagen_i_heterotrimer_structure_2017, collagen_transcript_coordination_1996]

  - genes: [COL1A1, DCN]
    classification: direct binding and matrix-function evidence
    summary: Decorin binds a mapped region of the type-I collagen alpha-1 chain and regulates collagen fibril organization.
    direct_relationship: Electron microscopy and photoaffinity labeling mapped decorin binding to an alpha-1(I) fragment.
    shared_program_or_pathway: Both participate in fibroblast extracellular-matrix assembly.
    coexpression_or_cell_state: Shared stromal expression can also produce association independent of direct binding.
    perturbational_evidence: Decorin knockout caused irregular collagen fibrils, lateral fusion, and reduced tissue tensile strength.
    gastric_specific_evidence: The decisive binding and knockout experiments are not gastric-specific.
    limitations: The knockout phenotype concerns the collagen network broadly and does not validate the model's COL1A1-directed sensitivity.
    source_ids: [col1_dcn_binding_2000, dcn_knockout_1997]

  - genes: [COL3A1, DCN]
    classification: direct in-vitro biochemical interaction
    summary: Decorin binds type-III collagen fibrils during fibrillogenesis and changes fibril incorporation and diameter.
    direct_relationship: Cell-free fibrillogenesis experiments directly measured decorin association with type-III collagen.
    shared_program_or_pathway: Both are components of fibroblast extracellular-matrix programs.
    coexpression_or_cell_state: A shared fibroblast or activated-stromal state remains an additional explanation for tissue-level association.
    perturbational_evidence: Adding decorin reduced type-III collagen incorporation into fibrils and decreased fibril diameter.
    gastric_specific_evidence: The direct experiment is in vitro and not gastric-cancer-specific.
    limitations: It does not establish gene regulation, model direction, or an in-vivo gastric mechanism.
    source_ids: [col3_dcn_fibrillogenesis_2006]

  - genes: [COL1A2, COL3A1]
    classification: shared fibril system; chain-specific direct binding not shown
    summary: COL1A2 is an obligatory type-I collagen chain, and type-I and type-III collagens form coupled fibrils; direct COL1A2-to-COL3A1 chain binding was not established.
    direct_relationship: Evidence supports interaction at the assembled-collagen and fibril level, but the native crosslink study identified alpha-1(I), not alpha-2(I), crosslinks to alpha-1(III).
    shared_program_or_pathway: Both participate in fibrillar-collagen extracellular-matrix assembly.
    coexpression_or_cell_state: Their transcripts are coordinated in many fibroblast-containing tissues.
    perturbational_evidence: Col3a1 loss disrupts type-I fibrillogenesis, but the effect is not specific to the COL1A2 chain.
    gastric_specific_evidence: No direct gastric-specific pair perturbation was found.
    limitations: The relationship is biologically strong at the fibril level but weaker as a chain-specific pair claim.
    source_ids: [collagen_i_iii_crosslink_1982, col3a1_knockout_1997, collagen_transcript_coordination_1996]

  - genes: [COL1A1, ACTA2]
    classification: shared myofibroblast program with limited regulatory evidence
    summary: COL1A1 and ACTA2 co-mark activated myofibroblast and fibrotic states; no direct protein complex is established.
    direct_relationship: COL1A1 is a secreted matrix chain and ACTA2 is a cytoskeletal contractile actin; a direct complex was not supported.
    shared_program_or_pathway: Both are induced in TGF-beta-associated activated fibroblast programs.
    coexpression_or_cell_state: Advanced gastric-cancer samples showed correlated collagen-I and alpha-SMA staining.
    perturbational_evidence: ACTA2 knockdown reduced TGF-beta-induced COL1A1 and collagen production in cultured periodontal-ligament cells, with proliferation as a possible confounder.
    gastric_specific_evidence: Gastric fibroblast experiments and clinical staining support a common activated-stroma state.
    limitations: The evidence is consistent with shared cell state and indirect regulation, not direct binding or the model's aggregate direction.
    source_ids: [gastric_col1_acta2_2025, acta2_knockdown_col1a1_2023]

  - genes: [ACTA2, PSCA]
    classification: weak unvalidated co-capture; compartment association more plausible
    summary: One PSCA-FLAG proteomics table listed ACTA2 with two peptides, but the study did not validate or functionally test that hit; gastric epithelial-versus-stromal compartment mixing is better supported.
    direct_relationship: No replicated direct interaction was found. The low-peptide ACTA2 co-capture occurred with several homologous actins, while the paper validated a different interactor.
    shared_program_or_pathway: ACTA2 marks smooth-muscle and CAF states, whereas PSCA is a gastric epithelial surface protein; they do not define one canonical program.
    coexpression_or_cell_state: Gastric studies place PSCA in differentiating epithelium and ACTA2 in stromal or alpha-SMA-positive CAF compartments, making an inverse abundance association plausible.
    perturbational_evidence: No targeted reciprocal co-immunoprecipitation, ACTA2-PSCA perturbation, rescue, or regulatory experiment was found.
    gastric_specific_evidence: Independent gastric histology and single-cell or spatial studies support different primary compartments, not a direct pairwise mechanism.
    limitations: IntAct and STRING had no exact pair edge, but database absence is incomplete evidence; the proteomic co-capture remains an unvalidated hint.
    source_ids: [psca_acta2_cocapture_2020, psca_gastric_epithelium_2008, acta2_gastric_caf_2023, intact_acta2_psca_query_2026, string_acta2_psca_query_2026]
