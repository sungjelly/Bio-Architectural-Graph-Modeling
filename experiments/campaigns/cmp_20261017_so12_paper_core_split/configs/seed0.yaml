model:
  name: relative-qkv-gat
  family: relative_geometry_qkv_graph_transformer
  embedding_dim: 256
  hidden_dim: 256
  graph_layers: 4
  attention_heads: 8
  attention_head_dim: 32
  ffn_dim: 1024
  decoder_dim: 1024
  relative_geometry_dim: 70
  positional_bias_hidden_dim: 128
  positional_bias_final_zero_init: true
  relative_geometry_role: attention_logit_bias_only
  dropout: 0.1
  attention_dropout: 0.0
  receiver_chunk_size: 512
  max_edges_per_chunk: 200000
  activation_checkpointing: true
  exact_receiver_partitioning: true
  fp32_attention_accumulation: true
  implicit_self_loops: false
  trainable_node_identifiers: false
  trainable_edge_identifiers: false
  uses_graph_inputs: true
  uses_edge_inputs: false
  uses_relative_position: true
  edge_key_vectors: false
  edge_value_vectors: false
  edge_value_gates: false
masking:
  type: uniform_per_cell_integer_count
  distribution: discrete_uniform_masked_gene_count
  count_min: 0
  count_max: 1000
  count_support_inclusive: true
  positions_without_replacement: true
  independent_across_cells: true
  independent_views_per_core_epoch: 10
  ratio_stratification_or_bins: false
  all_graph_cells_masked_by_same_rule: true
  mask_base_seed: 2026101701
  model_seed_in_mask_derivation: false
  mask_seed_derivation_fields:
  - base_mask_seed
  - core_alias
  - global_epoch
  - mask_view_index
  mask_expression_only: true
  explicit_gene_mask_channel: true
  metadata_masked: false
  encoder_reapplies_mask: true
  zero_mask_step_policy: deterministic_fail_closed_resample_from_prespecified_seed_namespace
  required_view_provenance:
  - view_index
  - derived_seed
  - mask_checksum
  - masked_count_distribution_summary
  train_seed_namespace: so12_paper_training_v1
features:
  use_edge_features: false
  fit_scope: pooled_training_cells_only
  node_expression:
    biological_targets: 1000
    transformed_with: observed_only_quasipoisson_pearson_frozen_train_statistics
    masked_values_removed_inside_encoder: true
    explicit_mask_channel: true
  node_metadata:
    transformed_with: pooled_training_median_imputation_log1p_standardization
    always_visible: true
    fields:
    - Area
    - Area.um2
    - AspectRatio
    - Width
    - Height
    - Mean.PanCK
    - Max.PanCK
    - Mean.G
    - Max.G
    - Mean.Membrane
    - Max.Membrane
    - Mean.CD45
    - Max.CD45
    - Mean.DAPI
    - Max.DAPI
    - SplitRatioToLocal
    - NucArea
    - NucAspectRatio
    - Circularity
    - Eccentricity
    - Perimeter
    - Solidity
    fit_scope: pooled_training_cells_only
  relative_positional_encoding:
    role: attention_logit_bias_only
    dimension: 70
    radial_rbf_count: 64
    distance_range_um:
    - 0.0
    - 500.0
    smooth_cutoff: true
    local_orientation_tensor: coordinate_only_axial_traceless_2d
    cache_policy: one_shared_read_only_memory_map_per_core
    cache_reproducible_from_minimal_geometry: true
    cache_copied_into_run_bundle: false
  prohibited_node_inputs:
  - absolute_or_local_coordinates
  - core_alias_or_number
  - slide_or_fov_identity
  - cell_or_patient_identifiers
  - vendor_cell_type_cluster_neighborhood_niche
  - expression_derived_library_size_or_qc_totals
  - target_derived_annotations
graph:
  kind: radial_stratified_knn
  neighbor_k: 200
  k: 200
  radius_um: 500.0
  maximum_range_um: 500.0
  radial_shells:
  - lower_um: 0.0
    upper_um: 50.0
    quota: 48
  - lower_um: 50.0
    upper_um: 150.0
    quota: 64
  - lower_um: 150.0
    upper_um: 300.0
    quota: 48
  - lower_um: 300.0
    upper_um: 500.0
    quota: 40
  quota_refill: nearest_remaining_within_500um
  tie_breaking: distance_then_source_index
  symmetry: union
  directed_selection_then_bidirectional_union: true
  deduplicate_directed_edges: true
  canonical_order: receiver_then_source
  min_distance_um: 0.0
  edge_dropout: 0.0
  self_loops: false
  cross_core_edges: false
  graph_batches: twenty_one_train_five_validation_two_sealed_test_complete_core_graphs
  coordinates_are_node_covariates: false
  construction_receiver_chunk_size: 512
  exact_search_epsilon: 0.0
  long_range_coverage_shell_um:
  - 300.0
  - 500.0
  require_all_eligible_long_range_covered: true
launcher:
  kind: local_subprocess
  concurrency: 1
  requested_gpu: 0,1,2,3
  requested_gpu_count: 4
  set_cuda_visible_devices: true
  require_exact_visible_devices: 0,1,2,3
  distributed: true
  distributed_backend: nccl
  process_count: 4
  elastic_max_restarts: 0
  hardware_preflight_receipt: /workspace/BAGM/scratch/active_runs/pf_so12_paper_split_seed0/preflight.json
  gpu_model_assumption: NVIDIA GeForce RTX 3090
  gpu_memory_gb_assumption: 24
  heartbeat_seconds: 30
  stale_after_seconds: 900
  disk_safety_min_free_gb: 5
  capture_stdout: true
  capture_stderr: true
  active_output_root: scratch/active_runs
  finalized_output_root: artifacts/runs
  preflight_receipt: /workspace/BAGM/scratch/active_runs/pf_so12_paper_split_seed0/preflight.json
  gpu_memory_allocated_limit_gb: 21
