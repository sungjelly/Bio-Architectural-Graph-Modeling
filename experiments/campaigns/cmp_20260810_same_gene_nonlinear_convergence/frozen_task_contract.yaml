  evaluated_folds: [0, 1, 2, 3]
  per_trajectory_saturated_if_either:
    selected_epoch_is_below_192: true
    literal_relative_gain_condition: '(MSE_at_96 - MSE_at_192) / MSE_at_96 <= 0.001'
  combination: all_eight_trajectories_must_be_saturated
  failure_verdict: optimization_inconclusive_at_192_epochs

frozen_scientific_gates:
  near_vs_morphology:
    minimum_relative_mse_gain: 0.02
    minimum_folds_favoring_near: 3
  near_vs_permuted:
    minimum_relative_mse_gain: 0.01
    minimum_folds_favoring_near: 3
  diagonal_enrichment:
    minimum_ratio: 2.0
  strict_row_selectivity:
    minimum_row_top1_fraction: 0.25
    minimum_row_top1_percent_fraction: 0.50
  near_vs_permuted_diagonal:
    minimum_ratio: 1.25
    minimum_folds_at_or_above_ratio: 3
  fold_stability:
    minimum_median_spearman: 0.70
    minimum_sign_consistent_fraction: 0.75
  technical:
    finite_outputs: true
    exact_nonlinear_control: true
    identity_oracle_row_top1_fraction: 1.0
    maximum_peak_vram_gb: 20.5

attribution_gates:
  bootstrap:
    unit: geometry_component
    paired_component_count: 27
    draws: 10000
    seed: 20260821
    confidence_interval: [0.025, 0.975]
    same_resample_for_selected_and_anchor12: true
  prediction_failure_explained:
    - selected_near_vs_morphology_frozen_gate_passes
    - lower_95_bound_of_selected_minus_anchor12_relative_gain_is_above_zero
    - selected_near_mse_better_than_anchor12_near_mse_in_at_least_3_of_4_folds
  row_failure_explained:
    - selected_strict_row_selectivity_frozen_gate_passes
    - aggregate_row_top1_fraction_exceeds_fixed12
    - aggregate_row_top1_percent_fraction_exceeds_fixed12
    - row_top1_fraction_improves_in_at_least_3_of_4_fold_matrices
    - row_top1_percent_fraction_improves_in_at_least_3_of_4_fold_matrices
  strong_budget_explanation_requires:
    - antecedent_anchor_valid
    - convergence_gate_passes
    - prediction_failure_explained
    - row_failure_explained

secondary_comparisons:
  antecedent_12_epoch:
    interpretation: paired_attribution_not_independent_replication
  ridge:
    superiority_requires:
      paired_component_bootstrap_95_lower_bound_above_zero: true
      minimum_folds_improved: 3

verdict_precedence:
  - if: antecedent_anchor_invalid
    verdict: attribution_invalid_anchor_mismatch
  - if: convergence_gate_fails
    verdict: optimization_inconclusive_at_192_epochs
  - if: all_seven_scientific_gates_pass_and_both_attribution_gates_pass
    verdict: strict_selectivity_supported_and_12_epoch_budget_explains_both
  - if: all_seven_scientific_gates_pass
    verdict: strict_selectivity_supported_without_full_budget_attribution
  - if: both_attribution_gates_pass
    verdict: budget_explains_both_prior_failures_but_other_gate_failed
  - if: prediction_failure_explained_only
    verdict: budget_explains_prediction_failure_only
  - if: row_failure_explained_only
    verdict: budget_explains_row_failure_only
  - if: all_non_row_scientific_gates_pass_and_strict_row_selectivity_fails
    verdict: robust_nonexclusive_enrichment_after_convergence
  - if: otherwise
    verdict: evidence_against_12_epoch_budget_explanation

