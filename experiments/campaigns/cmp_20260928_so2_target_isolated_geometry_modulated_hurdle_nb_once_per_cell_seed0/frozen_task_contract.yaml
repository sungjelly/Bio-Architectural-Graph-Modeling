      - graph_block_1
      - graph_block_2
      - graph_block_3
      - raw_inverse_dispersion
    persist_vectors: false

hypotheses:
  primary_optimization: >-
    The best fixed-mask pooled joint hurdle NLL improves by more than 0.0001
    relative to epoch 1 while losses and all required gradients remain finite.
  paired_observation_model: >-
    Explicitly separating zero occurrence from positive magnitude improves
    joint validation likelihood and/or zero Brier score relative to the
    paired ordinary-NB2 campaign under identical data exposure and masks.
  alternatives:
    - ordinary_nb2_already_models_zero_mass_adequately
    - hurdle_detection_head_overfits_the_zero_heavy_validation_objective
    - positive_masked_subset_is_too_sparse_for_stable_count_head_learning
    - zero_truncation_normalizer_is_numerically_unstable_at_small_means
    - neighbor_context_adds_no_useful_information
  claim_limit: >-
    This one validation-selected seed supports at most a matched exploratory
    observation-model comparison. It is not an unbiased test, replication,
    mechanism, generalization, or causal result.

