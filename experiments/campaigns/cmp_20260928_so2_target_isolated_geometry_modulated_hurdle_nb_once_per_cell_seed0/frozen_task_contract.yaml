scientific_question: >-
  Does a proper Bernoulli hurdle plus zero-truncated NB2 observation model
  improve matched fixed-mask target-isolated reconstruction and zero
  calibration relative to ordinary NB2 while data exposure, graph routing,
  masks, and optimization remain fixed?

