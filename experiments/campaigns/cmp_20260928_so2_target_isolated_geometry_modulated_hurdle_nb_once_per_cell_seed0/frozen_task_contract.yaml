implementation_acceptance:
  required: all_preflight_gates_pass
  launch_blockers:
    - configuration_contract_or_code_hash_mismatch
    - incorrect_parameter_count_or_decoder_topology
    - validation_dependent_initialization
    - non_normalized_or_numerically_unstable_hurdle_likelihood
    - missing_or_duplicate_target_visit
    - empty_target_mask
    - paired_comparator_mask_mismatch
    - masked_neighbor_context_entry
    - self_edge_or_target_as_context_source
    - target_hidden_value_return_path
    - non_masked_entry_weighted_joint_objective
    - fixed_validation_mask_or_metric_drift
    - nonfinite_loss_gradient_or_parameter
    - ddp_reference_or_parameter_sync_mismatch
    - checkpoint_reload_or_metric_replay_failure
    - insufficient_vram_or_disk_headroom

acceptance_and_falsification:
  implementation: all_required_preflight_gates_pass_and_receipt_is_checksum_bound
  primary_optimization_supported_if: best_joint_validation_nll_improves_over_epoch_1_by_more_than_0.0001
  primary_optimization_falsified_if: no_such_improvement_or_numerical_failure
  paired_hypothesis_supported_if: >-
    Under exact paired masks, the hurdle run improves at least one prespecified
    target metric without an unacceptable degradation in the other; joint NLL
    and zero Brier must be reported together rather than selectively.
  paired_hypothesis_not_supported_if: >-
    Neither joint NLL nor zero Brier improves, or apparent gain depends on a
    leakage, denominator, replay, or numerical failure.

