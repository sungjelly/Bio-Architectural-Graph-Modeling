model:
  config: configs/model/target_isolated_geometry_modulated_relative_qkv_gat_hurdle_nb2_256_l4_h8.yaml
  name: target-isolated-geometry-modulated-relative-qkv-gat-hurdle-nb2
  family: target_isolated_geometry_modulated_relative_qkv_hurdle_graph_transformer
  seed: 0
  hidden_dim: 256
  graph_layers: 4
  unique_graph_blocks: 4
  graph_block_weight_tying: none
  attention_heads: 8
  attention_head_dim: 32
  ffn_dim: 1024
  decoder_shared_trunk_dim: 1024
  decoder_final_projections:
    count_mean_genes: 1000
    detection_logit_genes: 1000
  geometry_hidden_dim: 128
  relative_geometry_dim: 70
  trainable_parameter_count: 6160088
  output_distribution: bernoulli_hurdle_zero_truncated_negative_binomial_nb2
  output_mean: softplus_plus_0.0001
  inverse_dispersion: learned_per_gene_shared_across_cells
  inverse_dispersion_initial_value: 1.0
  detection_probability: sigmoid_of_nonzero_logit
  detection_probability_epsilon: 0.0001
  detection_weight_initialization: zeros
  detection_bias_initialization: logit_of_jeffreys_smoothed_training_nonzero_prevalence
  detection_prevalence_formula: (training_positive_count_per_gene + 0.5) / (208696 + 1)
  detection_prevalence_clamp: [0.0001, 0.9999]
  initialization_fit_scope: twelve_training_cores_only

two_stream_routing:
  schema: target_isolated_two_stream_routing_v1
  shared_node_encoder_parameters: true
  target_query_stream:
    input_expression: target_row_with_selected_genes_zeroed_before_forward
    mask_channel: explicit
    metadata: allowed_morphology_visible
    state: evolves_through_four_independent_blocks
    projection_role: query_and_target_residual_ffn
  neighbor_key_value_stream:
    input_expression: fully_observed_train_standardized_log1p_expression
    mask_channel: all_false
    metadata: allowed_morphology_visible
    state: static_cell_autonomous_encoder_output_across_all_blocks
    projection_role: per_block_keys_and_values
  permitted_edges: incoming_neighbor_source_to_target_receiver
  self_edges: prohibited
  target_state_as_key_or_value: prohibited
  target_to_context_messages: prohibited
  context_to_context_messages: prohibited
  context_state_updates: prohibited
  geometry_role: dimensionwise_qk_modulation_and_scalar_bias_only
  geometry_in_values: prohibited
  raw_count_target_in_model_forward: prohibited
  leakage_argument:
    - masked target values are zeroed before forward and removed again by the encoder
    - raw count targets are accepted only by loss helpers
    - the receiver is excluded from its fully observed context
    - target state is never a source key or value
    - static context cannot receive a target message
    - therefore no target-hidden-value return path exists at any depth

masking:
  config: configs/masking/target_cell_uniform_1_1000_once_per_epoch_fixed_validation_hurdle_nb.yaml
  paired_comparator_seed_reuse_is_intentional: true
  training_target_visits_per_cell_per_global_epoch: 1
  training_mask_realizations_per_target_visit: 1
  masked_gene_count_distribution: discrete_uniform_1_through_1000_inclusive
  positions: sampled_without_replacement
  empty_target_masks: prohibited
  full_target_masks: allowed
  only_target_query_rows_masked: true
  neighbor_context_rows_fully_observed: true
  mask_base_seed: 2026092601
  training_seed_namespace: bagm.so2.target_isolated_nb.training_masks.v1
  training_seed_fields: [namespace, base_seed, core_alias, global_epoch, target_row_index]
  validation:
    target_visits_per_cell: 1
    mask_realizations_per_target: 1
    fixed_across_epochs: true
    seed_namespace: bagm.so2.target_isolated_nb.fixed_validation_masks.v1
    seed_fields: [namespace, core_alias, target_row_index]
  model_seed_affects_masks: false

likelihood:
  family: bernoulli_hurdle_zero_truncated_negative_binomial_nb2
  normalized_probability:
    zero: one_minus_nonzero_probability
    positive: nonzero_probability_times_nb2_probability_divided_by_one_minus_nb2_zero_probability
  detection_term:
    support: every_masked_entry
    loss: binary_cross_entropy_with_logits_against_indicator_y_greater_than_zero
  positive_count_term:
    support: positive_masked_entries_only
    loss: full_constant_nb2_nll_plus_log_one_minus_nb2_zero_probability
    zero_truncation_normalizer: stable_fp32_log1mexp_of_log_nb2_zero_probability
  joint_numerator: detection_nll_sum_plus_positive_zero_truncated_nb2_nll_sum
  joint_denominator: all_masked_entries
  optimization_aggregation: exact_masked_entry_weighted
  positive_stratum_reweighting: false
  equal_target_or_equal_core_reweighting: false
  compute_dtype: float32_outside_autocast

optimization:
  config: configs/trainer/so2_target_isolated_geometry_modulated_hurdle_nb_train12_val2_earlystop.yaml
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.00001
  gradient_clip_norm: 1.0
  precision: mixed_model_with_fp32_likelihood
  cores_per_optimizer_update: 2
  optimizer_updates_per_global_epoch: 6
  global_epoch_definition: every_one_of_208696_training_cells_targeted_exactly_once
  core_order_seed: 2026092602
  target_shard_seed: 2026092603
  distributed_world_size: 4
  graph_tensor_placement: cpu_receiver_major_edge_index_and_float32_relative_geometry
  target_shards_per_core: 4
  rank_assignment:
    rank_0: disjoint_contiguous_target_shard_0_of_each_core
    rank_1: disjoint_contiguous_target_shard_1_of_each_core
    rank_2: disjoint_contiguous_target_shard_2_of_each_core
    rank_3: disjoint_contiguous_target_shard_3_of_each_core
  core_execution_within_update: sequential_first_core_no_sync_second_core_synced
  ddp_rule: world_size_times_local_two_core_joint_sum_divided_by_all_reduced_two_core_global_masked_entry_count_before_ddp_gradient_mean

scheduling_and_stopping:
  maximum_global_epochs: 300
  minimum_global_epochs: 50
  validation_every_global_epochs: 1
  scheduler:
    name: reduce_lr_on_plateau
    monitor: val/target_only_masked_hurdle_negative_binomial_nll
    mode: min
    factor: 0.5
    patience: 8
    threshold_mode: abs
    threshold: 0.0001
    minimum_learning_rate: 0.000001
  exact_checkpoint_selection:
    monitor: val/target_only_masked_hurdle_negative_binomial_nll
    rule: strict_lower_value
    starts_epoch: 1
  early_stopping_control:
    monitor: val/target_only_masked_hurdle_negative_binomial_nll
    mode: min
    patience_clock_starts_after_epoch: 50
    patience: 25
    minimum_delta: 0.0001
  exact_selection_state_separate_from_patience_control_state: true
  restore_best: true

evaluation:
  config: configs/evaluation/so2_target_isolated_hurdle_nb_train12_val2_fixed_masks_earlystop.yaml
  protocol: donor_grouped_so2_target_isolated_hurdle_nb_once_per_cell_earlystop_v1
