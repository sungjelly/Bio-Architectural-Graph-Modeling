schema_version: 1
campaign_id: cmp_20260729_multiscale_hurdle_count_pilot
amendment_id: clarify_sender_null_estimand_and_mask_collision_audit
status: frozen_before_any_gpu_training
exploratory: true
original_frozen_contract_sha256: 54496bc73c8d6f2b3c2ec9885fba86b2021944462a106dbd10a23cfd88e25fb7
supplements:
  amendment_reference: experiments/campaigns/cmp_20260729_multiscale_hurdle_count_pilot/contract_amendment_002.yaml
  amendment_sha256: 6864fff7d35ce3af2312b8985a5fb7356b36bdd568bdcba4514ab0eaa3867cd2
  execution_design_changed: false
reason: >-
  A pre-training audit identified two points requiring explicit treatment.
  First, the true and permuted arms use identical topology, so their contrast
  estimates dependence on correctly aligned local sender state conditional on
  topology; it does not by itself estimate topology dependence. Second, a
  small number of permuted source slots equal their receiver. The encoder mask
  must be shown to prevent those slots from exposing hidden receiver
  expression.
deterministic_axis_numeric_definition:
  covariance_precision: IEEE_754_float64
  covariance_divisor: macroblock_node_count
  eigenvalue_tie_discriminant: hypot(cov_xx_minus_cov_yy, 2_times_cov_xy)
  tie_tolerance: 64_times_float64_epsilon_times_max_abs_covariance_entry_or_one
  tie_or_degenerate_axis: positive_x
  leading_eigenvector_sign: largest_absolute_loading_positive_with_x_tie_break
  ordering_tie_break: stable_node_row_index
observed_pretraining_collision_qc:
  gpu_training_performed: false
  effective_source_equals_receiver_directed_slot_fraction_range:
    minimum: 0.000345
    maximum: 0.000461
  receivers_with_at_least_one_effective_self_slot_fraction_range:
    minimum: 0.01979
    maximum: 0.02698
  disposition: retained_as_disclosed_conservative_null_feature
mandatory_mask_noninterference_gate:
  required_before_gpu_training: true
  whole_node_prediction_invariant_to_all_hidden_receiver_expression_values: true
  partial_gene_prediction_invariant_to_hidden_receiver_entries: true
  test_fixture_must_include_effective_permuted_source_equals_receiver_slot: true
  tolerance:
    relative: 0.0
    absolute: 0.0
  rationale: >-
    The authoritative mask is applied inside the shared encoder before self,
    regional, or local gathering. An effective self slot may reuse permitted
    morphology and unmasked partial-gene information, making the null slightly
    self-like and conservative, but it must never expose a masked value.
contrast_estimands:
  self_regional_local_vs_self_regional: >-
    graph-specific predictive gain from adding the observed local branch over
    the matched self plus regional model
  self_regional_local_vs_self_regional_local_permuted: >-
    predictive dependence on correctly aligned local sender state conditional
    on identical observed topology, receivers, and edge attributes
  combined_maximum_claim: >-
    exploratory held-in graph-specific and correctly aligned local
    sender-state predictive dependency
  prohibited_inference:
    - sender_state_contrast_is_topology_contrast
    - cell_cell_communication
    - biological_mechanism
    - causal_influence
scientific_direction: claim_narrowed_and_mask_safety_strengthened_before_training
