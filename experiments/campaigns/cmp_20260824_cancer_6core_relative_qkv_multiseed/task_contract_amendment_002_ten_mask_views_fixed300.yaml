amendment_schema_version: 1
amendment_id: cmp_20260824_relative_qkv_ten_mask_views_fixed300_002
campaign_id: cmp_20260824_cancer_6core_relative_qkv_multiseed
issued_at_utc: "2026-08-24"
authority: explicit_user_instruction
user_instruction_summary: Use ten independent full-range masking views per core and global epoch, average their gradients into one core update, and stop at epoch 300.
supersedes:
  - amendment_id: cmp_20260824_relative_qkv_joint_plateau_001
    scope: stopping_policy
    reason: The later instruction explicitly restores 300 global epochs and a final epoch-300 checkpoint.
  - frozen_contract_fields:
      - masking.views_per_core_epoch
      - training.complete_core_forwards_per_optimizer_step

masking:
  views_per_core_global_epoch: 10
  per_view_distribution: independent_discrete_uniform_masked_gene_count
  masked_count_support_inclusive: [0, 1000]
  positions_sampled_uniformly_without_replacement: true
  ratio_bins_or_strata: false
  seed_derivation_fields:
    - base_mask_seed
    - core_alias
    - global_epoch
    - mask_view_index
  model_seed_in_derivation: false
  required_per_view_provenance:
    - view_index
    - derived_seed
    - mask_checksum
    - masked_count_distribution_summary

core_optimizer_step:
  sequence:
    - optimizer_zero_grad_once
    - ten_complete_core_forward_passes
    - ten_masked_huber_losses
    - backward_each_loss_divided_by_10
    - unscale_and_clip_gradients_once
    - optimizer_step_once
  gradient_aggregation: arithmetic_mean_of_ten_mask_view_gradients
  optimizer_steps_per_core_global_epoch: 1

fixed_training:
  global_epochs_per_model: 300
  cores_per_global_epoch: 6
  mask_views_per_core_epoch: 10
  complete_core_forward_backward_views_per_model: 18000
  complete_core_forward_backward_views_all_models: 90000
  optimizer_steps_per_model: 1800
  optimizer_steps_all_models: 9000
  masks_per_cell_per_model: 3000
  early_stopping: false
  plateau_extension: false
  checkpoint_selection: none
  canonical_checkpoint: final_epoch_300_last

resume:
  boundary: completed_global_epoch
  preserve_completed_view_schedule: true
  future_mask_sequence_rederived_exactly_from_locked_seed_fields: true

interpretation:
  non_plateau_at_epoch_300: report_as_a_limitation_without_extending_training

