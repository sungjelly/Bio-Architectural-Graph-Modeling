amendment_schema_version: 1
amendment_id: cmp_20260824_relative_qkv_seed0_first_004
campaign_id: cmp_20260824_cancer_6core_relative_qkv_multiseed
issued_at_utc: "2026-08-24"
authority: explicit_user_instruction
user_instruction_summary: Run only one model and one seed first, focusing on one checkpoint after training loss plateaus.
supersedes:
  - amendment_id: cmp_20260824_relative_qkv_joint_plateau_min150_003
    scope:
      - active_model_seed_count
      - joint_five_seed_plateau_condition
      - immediate_completion_gate
    reason: The later instruction narrows immediate execution to one seed because time is limited.
preserves:
  - all_six_cancer_cores
  - one_shared_model_across_disconnected_core_graphs
  - ten_independent_mask_views_per_core_step
  - one_optimizer_step_per_core
  - model_seed_independent_mask_schedule
  - minimum_epoch_150
  - no_validation_or_test_partition
  - exact_attention_without_neighbor_sampling

active_execution:
  model_seeds: [0]
  model_count: 1
  deferred_model_seeds: [1, 2, 3, 4]
  deferred_runs_are_currently_required_for_completion: false
  deferred_multiseed_stability_report_required_now: false

plateau_rule:
  metric: equal_core_mean_training_masked_huber
  first_allowed_audit_epoch: 150
  audit_interval_global_epochs: 25
  window_global_epochs: 50
  consecutive_passing_audits_required: 2
  conditions:
    relative_mean_improvement_last_25_vs_previous_25_max: 0.002
    absolute_linear_slope_over_last_50_divided_by_window_mean_max_per_epoch: 0.0001
    all_window_losses_finite: true
  scope: seed_0_training_history_only
  validation_or_test_metric: false
  checkpoint_selection_metric: false
  behavior_when_audit_fails: continue_seed_0_for_25_more_global_epochs
  maximum_scientific_epoch_cap: null
  earliest_possible_stop_epoch: 175

completion:
  required_checkpoint_count: 1
  required_model_seed: 0
  checkpoint_role: last_confirmed_training_loss_plateau_epoch
  must_be_independently_loadable: true
  must_have_completion_marker: true
  five_seed_campaign_completion_claim_allowed: false

interpretation:
  statement: This phase may complete only the seed-0 model; seeds 1 through 4 and ensemble stability remain explicitly deferred and must not be reported as completed.
