schema_name: bagm_result_record
schema_version: 1
revision: 1
result_id: res_so2_prediction_pearson
title: Masked-expression Pearson for existing SO2 count and historical BAGM predictors
status: verified
outcome: supported
experiment_type: descriptive_analysis
method_family: spatial_reconstruction
lifecycle_stage: exploratory_posthoc
study_axis: masked_expression_correlation
campaign_ids:
- cmp_20261015_so2_prediction_pearson
method:
  name: Frozen-checkpoint Pearson metric extension under two native protocols
  model_family: Local Gene Residual hurdle-count MLP, seeds 0 and 1 at epoch 30; historical
    Relative-QKV graph Transformer, seed 0 at epoch 300
  graph_context: 'Local predictor: clean non-self same-gene neighbor summaries within
    75 micrometers, capped at 16 neighbors; historical predictor: original full-core
    spatial relative-geometry graphs'
  masking_or_perturbation: 'Preserved original masks: local target-isolated Uniform{1,...,1000}
    hidden genes per cell; historical simultaneous Uniform{0,...,1000} hidden genes
    per graph cell; include recorded zeros and positives'
  evaluation_design: 'Local: 37367 validation cells in two cores from one held-out
    donor, reused for checkpoint selection, after training on 12 cores; both seeds
    retained. Historical: 246063 fitted cells across all 14 cores, including the later
    validation cores; only seed 0 available. Report global and equal-core metrics
    separately; no cross-protocol superiority comparison.'
  implementation_version: so2_prediction_pearson_v1; source snapshots, checkpoint/data/mask
    hashes and immutable evaluation/comparison manifests preserved
conclusion:
  question: How strongly do the selected existing expression predictions covary with
    masked observed counts under their original evaluation protocols?
  estimand: 'Descriptive masked-entry reconstruction correlation: mean valid-cell
    Pearson, mean valid-gene Pearson and pooled Pearson, with log1p counts primary
    and native/additional scales separate'
  observed_result: On log1p observed counts, Local Gene Residual has mean cell-wise
    Pearson 0.315556, mean gene-wise Pearson 0.259823, and pooled Pearson 0.440311
    across seeds 0 and 1 on the reused validation donor. Historical Relative-QKV seed
    0 has corresponding fitted-cohort values 0.421892, 0.271327, and 0.561158. Local
    raw-count MAE/RMSE average 0.223391/1.100785. All three frozen checkpoint replays
    passed source, mask and native metric verification. These are separate native
    protocols and populations, not a matched ranking.
  strongest_alternative_explanation: Correlations can reflect gene abundance, same-cell
    coexpression or fitted-cohort reuse rather than spatial predictive gain; differences
    between endpoints can arise from masks, populations, permitted neighbor inputs
    and normalization.
  controls:
  - Independent SciPy fixture for masked cell/gene/pooled Pearson including empty,
    singleton and constant vectors; float64 accumulation
  - Checkpoint and source checksums; original mask counts and hashes; native per-core/global
    metric replay at unchanged tolerances 1e-5 local and 2e-6 historical
  - Both prespecified local seeds and the only historical seed retained; no retraining,
    new checkpoint selection or threshold tuning
  - Cell/gene/pooled correlations, raw/log/standardized scales, equal-core sensitivity
    and undefined-correlation counts reported separately
  remaining_uncertainty: The local validation donor was repeatedly used for selection
    and is not a sealed test; only one held-out donor is available. Historical fitting
    and normalization used all 14 cores. The two protocols differ in available neighbor
    information and cannot isolate an architecture or training-set-size effect. Seed
    variation is technical, not donor uncertainty. No new baseline/null evaluation,
    detection improvement, calibration or biological true-zero ground truth is established.
  maximum_defensible_claim: All selected frozen models exhibit positive descriptive
    masked-expression correlation under their own native protocols, with verified
    metric reconstruction. This adds reproducible metrics and does not establish SOTA,
    graph-specific superiority, independent-test generalization or biology.
evidence:
  predictive_gain:
    status: not_tested
    summary: No matched baseline or cross-protocol superiority test; positive correlations
      alone do not demonstrate spatial gain.
  stability:
    status: supported
    summary: Both local seeds give near-identical log-scale cell correlations (0.315539
      to 0.315573); all native metric replays pass. This covers technical seed/replay
      consistency only; historical has one seed and broader robustness is untested.
  faithfulness:
    status: not_tested
    summary: No attribution or graph-use faithfulness experiment.
  null_calibration:
    status: not_tested
    summary: No new biological or spatial nulls in this metric-extension task.
  patient_replication:
    status: not_tested
    summary: One reused local validation donor; historical evaluation entirely fitted-cohort.
  external_support:
    status: not_tested
    summary: No external benchmark or orthogonal molecular validation.
  perturbation_support:
    status: not_tested
    summary: No biological perturbation evidence.
