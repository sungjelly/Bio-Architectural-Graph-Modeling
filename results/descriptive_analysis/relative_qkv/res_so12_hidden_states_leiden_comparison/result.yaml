result_id: res_so12_hidden_states_leiden_comparison
title: SO1/SO2 initial and final hidden-state partitions compared with three PCA methods
status: verified
outcome: inconclusive
experiment_type: descriptive_analysis
method_family: relative_qkv
lifecycle_stage: exploratory_screen
study_axis: fully_observed_representation_comparison
campaign_ids:
- cmp_20261017_so12_h0_hl_leiden_segmentation
- cmp_20261016_so12_pearson_relative_qkv_train_validation
- cmp_20261016_so12_embeddings_leiden
method:
  name: Frozen four-layer SO1/SO2 Relative-Geometric QKV h0 and hL Leiden partitions, with existing
    Pearson PCA, RBF kernel PCA and spatial PCA partitions
  model_family: Relative-Geometric QKV Graph Transformer, four independent layers, width 256,
    eight attention heads; training seed 0 and validation-selected best checkpoint at epoch 151
  graph_context: Model inference uses full coordinate-only within-core radial-stratified k200/r500-micrometre
    graphs with 70 relative-geometry attention-bias features. Hidden-state clustering uses direct
    256-dimensional cosine k30 exhaustive FP32 neighbors, unweighted undirected-union graphs and
    Leiden until convergence. Prior PCA methods retain their 32-dimensional Euclidean HNSW k30
    graphs, exponential distance weights, arithmetic-mean symmetrization and two Leiden iterations.
  masking_or_perturbation: All observed genes are supplied during frozen-model inference; the
    gene mask is all false and permitted morphology remains visible. No training, masking sweep,
    data augmentation or biological perturbation is performed.
  evaluation_design: Extract and cluster all 407659 mapped cells from 28 cores across two slides.
    Primary Leiden resolution 1.0 and seed 0; hidden-state seed 1 is retained as a fixed-graph
    algorithmic stability check. Display the same 117996 original cell polygons from cores 1,
    9, 13, 15, 21 and 23. Core 13 is model validation; the other five displayed cores are training.
    Encoder fitting used the existing donor-separated split, but all-cell clustering is transductive.
    Compare existing labels on all cells, the six displayed cores pooled and each displayed core
    separately; never recluster those subsets. Provenance seeds describe Leiden seeds, while model
    and encoder seeds are 0; fold 0 denotes the existing fixed partition, not a sealed clustering
    test.
  implementation_version: so12_direct_hidden_clustering_v1 and so12_hidden_and_pca_segmentation_comparison_v1;
    final so12_hidden_leiden_report_v1 publication contains both prespecified Leiden seeds and
    independently verified extraction, clustering, numerical comparisons, rendered outputs and
    immutable checksums. Earlier so12_primary_seed0_delivery_v1 artifact is retained as a historical
    snapshot.
conclusion:
  question: How do the trained model's initial and final cell representations partition the integrated
    SO1/SO2 cohort, and how do those partitions compare with the existing three PCA methods on
    identical cells and tissue polygons?
  estimand: Exploratory fully observed, all-cell transductive representation partitions; descriptive
    adjusted Rand agreement of fixed partitions and within-method color maps on actual cell segmentation
    polygons
  observed_result: 'Full evaluation ev_so12_h0_hl_e151_20261017T005200Z completed and was published
    at 2026-10-17T04:54:25Z. All 407659 cells from 28 cores have complete primary h0/hL partitions;
    h0, hL, Pearson PCA, RBF kernel PCA and spatial PCA contain 16, 22, 19, 21 and 17 clusters.
    All-cell h0-hL ARI is 0.3701562885697946; hL agreement with PCA, kernel PCA and spatial PCA
    is 0.2849100927644078, 0.27736674118010246 and 0.39323740331417256. Across the six displayed
    cores pooled, these four ARIs are 0.3073985844326938, 0.3223382177716715, 0.36097262499127725
    and 0.6019284411347983. Fixed-graph Leiden seeds 0 and 1 yield h0 cluster counts 16/16 with
    ARI 0.8069532157597211, and hL counts 22/21 with ARI 0.8837090007869288. No primary h0 cluster
    has more than 90 percent of cells in one core; five primary hL clusters do: clusters 3, 10,
    12, 17 and 21 are dominated by cores 23, 15, 15, 3 and 21 at fractions 0.9881606765327695,
    0.9990174887011201, 0.9984255202628697, 0.9438857309430112 and 0.9896128423040604. Joint clustering
    therefore does not establish batch removal or integration quality. All 117996 displayed original
    polygons have complete coverage, zero repairs and zero alignment mismatches. Six five-method
    maps, overview and full 95-entry legends are available in PNG/PDF, with portable HTML, all-cell/per-core
    tables and a download ZIP.'
  strongest_alternative_explanation: Differences can reflect the encoder, dimensions, distance
    metric, neighbor search, edge weighting, Leiden iteration policy, slide or tissue composition,
    RNA depth, spatial smoothing or segmentation spillover rather than distinct biological cell
    states. Representation and clustering-pipeline effects are not isolated by this comparison.
  controls:
  - Verified checkpoint ownership and hashes, all-observed inputs, complete 28-core extraction,
    finite embeddings, largest-core exact repeat/invariance check and exact-neighbor pilots/audits.
  - Exact slide-qualified joins and coordinate agreement cover all 407659 cells. All 117996 requested
    polygons are retained with zero repairs and zero centroid-or-containment mismatches; one centroid
    beyond 5 micrometres is accepted because its coordinate lies inside its polygon, and eight
    outside coordinates are within the 5-micrometre tolerance.
  - All four actual h0/hL seed-0/seed-1 partition receipts and label hashes were checked. Fixed-graph
    seed ARIs were independently recomputed. All-method primary ARI matrices and cluster counts
    cover all cells, the six displayed cores pooled and each displayed core; statistics replayed
    exactly without reclustering.
  - Prior PCA labels and all 57 historical PCA palette entries are reused unchanged. Every core
    has matched five-method bounds, aspect, orientation and 100-micrometre scale bars with independent
    cluster namespaces and complete 95-entry color keys.
  - All six individual final maps, overview and legend passed root visual review; overview, legend
    and cores 13/23 passed additional independent review. All eight PNGs decoded, all eight PDFs
    passed header checks, six portable-HTML previews matched independent resampling of source
    PNGs, and numeric/color/polygon checks passed.
  - The final 249-file manifest and success marker bind the completed evaluation, independent
    numerical and visual audits, failed-attempt evidence and source snapshots. The final 18619413-byte
    download archive passed checksum and CRC checks. The earlier primary-only artifact and its
    pending-at-creation receipts remain unchanged as history.
  remaining_uncertainty: Fixed-graph seed agreement is imperfect, and hL seed 1 has 21 clusters
    versus 22 in seed 0. Two Leiden seeds assess algorithmic sensitivity only; one trained model
    seed and one fixed cohort are used. Five primary hL clusters are more than 90 percent concentrated
    in a single core, so joint clustering cannot establish integration or batch-removal quality.
    No independent cell-type annotations, biological replication, matched graphless encoder, geometry
    ablation, new spatial null calibration, segmentation perturbation, faithfulness evaluation
    or biological perturbation is included. PCA and hidden-state clustering pipelines differ,
    so cross-method agreement cannot isolate encoder quality. Failed evaluations ev_so12_h0_hl_e151_20261017T004300Z
    (logger argument collision before GPU work) and ev_so12_h0_hl_e151_20261017T004600Z (exact
    pilot detected an omitted deterministic-mode flag before saved embeddings) contribute no scientific
    outputs; immutable failure receipts and diagnostics are preserved in both the final evaluation
    and historical primary delivery.
  maximum_defensible_claim: The verified completed computational artifact provides all-observed
    h0/hL and three existing PCA partitions on identical cells, actual segmentation comparisons
    for six requested cores, measured cross-method partition agreement and two-seed fixed-graph
    Leiden sensitivity. These descriptive outputs do not establish cell types, batch removal,
    integration quality, biological superiority, graph-specific predictive gain, interactions
    or causality.
evidence:
  predictive_gain:
    status: not_tested
    summary: This is representation visualization and partition comparison, not a new masked-expression
      benchmark or graph-specific gain test.
  stability:
    status: mixed
    summary: Both prespecified fixed-graph Leiden seeds completed. h0 seed-0/seed-1 cluster counts
      are 16/16 with adjusted Rand index 0.8069532157597211; hL counts are 22/21 with adjusted
      Rand index 0.8837090007869288. Exact inference repeatability passed. Partition membership
      is sensitive to seed, and two algorithmic repeats do not assess model-training, patient
      or biological replication.
  faithfulness:
    status: not_applicable
    summary: No attribution, sensitivity or inferred interaction is interpreted; representation
      changes and ARI do not establish mechanism faithfulness.
  null_calibration:
    status: not_tested
    summary: No new biological or spatial null is part of this comparison; prior PCA diagnostic
      nulls do not calibrate hidden-state partitions.
  patient_replication:
    status: not_tested
    summary: Donor-separated encoder fitting does not make transductive all-cell clustering an
      independent-patient replication experiment.
  external_support:
    status: not_tested
    summary: No independent molecular measurements, pathology annotation or external cohort is
      used to validate cluster identities.
  perturbation_support:
    status: not_tested
    summary: No biological intervention is included.
