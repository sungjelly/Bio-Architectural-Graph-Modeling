schema_name: bagm_result_record
schema_version: 1
revision: 1
result_id: res_so12_test_cancer_representation_agreement
title: Frozen encoder cluster unions and outlined cancer regions in two SO12 test
  cores
status: verified
outcome: inconclusive
experiment_type: descriptive_analysis
method_family: representation_comparison
lifecycle_stage: exploratory_screen
study_axis: annotated_region_agreement
campaign_ids:
- cmp_20261018_so12_cancer_comparison
method:
  name: Frozen BAGM h0-h4, training-fitted Pearson PCA50 and raw-count scVI50; common
    Leiden and multi-cluster pixel Dice
  model_family: Relative-QKV graph encoder, linear PCA, and negative-binomial scVI
    with slide batch covariate
  graph_context: Joint81607 test-cell cosine k30 graph per representation; L2 rows,
    unweighted undirected union; converged RBConfiguration at resolutions0.25,0.5,1,2
    and seeds0,1
  masking_or_perturbation: All-observed inference;20 within-core label shuffles for
    primary settings; nominal selected unions held fixed under50µm annotation boundary
    sensitivity
  evaluation_design: PCA/scVI fitted on same21training cores264491cells; five validation
    cores only scVI stopping; test15/23 frozen inference. Joint test-cell clustering
    is transductive. Oracle annotation-selected union and opposite-core-selected union
    are separate estimands. Single fitted encoder seed0; provenance seeds0/1 denote
    Leiden, fold0 the fixed split.
  implementation_version: so12_cancer_comparison_v1; immutable checksummed source/environment/geometry/fit/cell/graph
    receipts
conclusion:
  question: How well can unions of frozen representation clusters match the supplied
    outlined regions on two held-out SO12 cores?
  estimand: Exploratory approximate-section region agreement on a method-independent
    segmented-cell footprint, with full-region coverage sensitivity and cross-core
    cluster-union transfer
  observed_result: 'Fixed resolution1 seed0 footprint Dice (core15/core23): h4: oracle
    0.7836/0.9171, other-core transfer 0.7457/0.8780; h3: oracle 0.7921/0.9143, other-core
    transfer 0.7332/0.8550; h2: oracle 0.7797/0.9115, other-core transfer 0.6589/0.8614;
    h1: oracle 0.7865/0.9011, other-core transfer 0.7400/0.8114; h0: oracle 0.7804/0.8867,
    other-core transfer 0.6705/0.8152; PCA: oracle 0.7710/0.8648, other-core transfer
    0.6492/0.7781; scVI: oracle 0.7292/0.9041, other-core transfer 0.6687/0.8497.
    All56 partitions (7 methods ×4 resolutions ×2 Leiden seeds) and both pixel supports
    retained. PCA50 retains 9.407% of training feature variance. All-positive footprint
    baselines are 0.6347/0.8502.'
  strongest_alternative_explanation: Annotation-selected unions and finer partitions
    can improve overlap without learning a transferable cancer identity. Core-specific
    clusters, morphology inputs, annotated prevalence, section mismatch and unmeasured
    annotation completeness can drive apparent differences.
  controls:
  - Same21training-core fit policy and1000genes; unchanged BAGM checkpoint194 and
    frozen Pearson statistics; no annotation inputs to encoder fitting or clustering.
  - All81,607 canonical cells and original keyed cell polygons; exact h0/h4 and ordinary-prediction
    reproduction during h1-h3 extraction; independent CPU exact-neighbor audits.
  - Same graph recipe, four prespecified resolutions and both Leiden seeds; main resolution1
    seed0 fixed before scoring.
  - Exact multicluster union Dice includes all selected outside-outline pixels as
    false positives; all-positive/empty controls,20 within-core shuffles and opposite-core
    union selection.
  - Geometry-only calibrated rotation/scale fitting, reflection comparison, visual
    review and tissue/landmark diagnostics; source outlines unchanged; fixed-union50µm
    boundary sensitivity and full-region coverage ceiling.
  - Compact scVI weights restored from best full validation ELBO, frozen before test
    inference; separate accurate scVI run and checkpoint catalog; auxiliary validation
    reconstruction is explicitly not BAGM masked accuracy.
  remaining_uncertainty: Only two cores, donor overlap and historical exposure; one
    fitted encoder seed. H&E screenshots lack an authoritative transform, exhaustive-label
    certification and verified same-section identity. Approximate alignment is strong
    in outer silhouette but core23 has substantial internal/acellular coverage discrepancy.
    Native-resolution raster omits641cells with no valid owned pixel and assigns overlaps
    deterministically. PCA/scVI lack BAGM morphology/graph inputs; scVI also models
    slide batches. Oracle is optimistic; transfer is between jointly clustered cores;
    no population significance or superiority claim.
  maximum_defensible_claim: Exploratory approximate-section cluster-union agreement
    in two cores; no unbiased cancer classifier accuracy or population superiority
    claim.
evidence:
  predictive_gain:
    status: not_tested
    summary: Cancer-region clustering agreement does not measure graph-specific masked-expression
      predictive gain; auxiliary scVI reconstruction is not a matched BAGM prediction
      benchmark.
  stability:
    status: mixed
    summary: 'Primary seed ARI: h0=0.732, h1=0.771, h2=0.749, h3=0.658, h4=0.537,
      pca=0.784, scvi=0.530. All resolutions/seeds and boundary sensitivities retained;
      no post-hoc pass threshold.'
  faithfulness:
    status: not_applicable
    summary: No attribution or inferred cell-cell interaction interpreted.
  null_calibration:
    status: mixed
    summary: All-positive prevalence and20 within-core shuffled-label controls reported;
      these are descriptive controls rather than realistic spatial or biological null
      validation.
  patient_replication:
    status: not_tested
    summary: Two cores with donor overlap allowed and historical exposure do not establish
      independent-patient replication.
  external_support:
    status: mixed
    summary: Supplied hand-outlined H&E regions provide external morphological comparison,
      limited by approximate registration, undocumented exhaustiveness and section
      identity.
  perturbation_support:
    status: not_tested
    summary: No controlled biological perturbation.
