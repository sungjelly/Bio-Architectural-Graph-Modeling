result_id: res_so12_normalized_embeddings_leiden
title: Three SO1/SO2 normalized representations yield different exploratory Leiden
  partitions
status: verified
outcome: inconclusive
experiment_type: descriptive_analysis
method_family: classical_encoders
lifecycle_stage: exploratory_screen
study_axis: representation
campaign_ids:
- cmp_20261016_so12_embeddings_leiden
method:
  name: Pearson PCA32, training-landmark RBF kernel PCA32 and spatial context PCA32
    with Leiden
  model_family: Classical linear, nonlinear kernel and neighborhood-context encoders;
    no neural training or checkpoint
  graph_context: Euclidean HNSW 30-neighbor representation graphs, locally scaled
    exponential weights and arithmetic-mean symmetrization; spatial context uses Gaussian-weighted
    up-to-15 neighbors within 50 micrometers in each core, weight 0.3, self fallback
    for isolated cells
  masking_or_perturbation: Fully observed Pearson-normalized expression; no expression
    masking. Twenty within-core cluster-label permutations provide descriptive spatial
    nulls.
  evaluation_design: 407659 mapped cells, 1000 genes, 28 cores, two slides; encoder
    fitting on ten training donor groups (301198 cells), frozen transformation of
    four diagnostic donor groups (106461 cells), then transductive all-cell clustering.
    Encoder seed 0; Leiden seed 0 at resolutions 0.5/1.0/1.5 and seed 1 at resolution
    1.0. Provenance seeds [0,1] refer to Leiden; fold 0 denotes the fixed preprocessing
    partition, not a sealed evaluation fold.
  implementation_version: so12_fully_observed_embeddings_v1; upstream so12_quasipoisson_v1;
    immutable source/environment/configuration snapshots; scheduling-only retry with
    four concurrent single-thread Leiden workers
conclusion:
  question: How do linear expression, nonlinear expression and local spatial-context
    representations change descriptive cell partitions in the normalized SO1/SO2 cohort?
  estimand: Exploratory all-cell transductive clustering and fixed-graph algorithmic
    agreement across Leiden seeds and representations
  observed_result: All three 407659-by-32 representations and four Leiden label sets
    per representation passed finite-value, row/key alignment and source checks. At
    resolution 1.0, seed 0, Pearson PCA, RBF kernel PCA and spatial context PCA yield
    19, 21 and 17 clusters; seed 1 yields 19, 23 and 18. Seed ARIs are 0.706129, 0.697725
    and 0.825291. At resolutions 0.5/1.5, seed-0 cluster counts are 9/32, 10/33 and
    10/29. Cross-method ARIs are PCA/kernel 0.650047, PCA/spatial 0.514149, and kernel/spatial
    0.499264. Mean 30-neighbor recall on 256 exact-query checks is 0.988021, 0.997656
    and 0.990885. Spatial same-cluster edge agreement is 0.476371 versus within-core
    label-permutation mean 0.241628; this continuity is partly imposed by spatial
    inputs.
  strongest_alternative_explanation: Partition differences and apparent tissue domains
    can reflect geometric transformations, algorithmic instability, depth/slide/tissue
    composition, segmentation spillover or imposed spatial smoothing rather than distinct
    biological cell states.
  controls:
  - Frozen training-only Pearson normalization and PCA; new kernel landmarks and spatial
    PCA parameters use the same ten training donor groups. Spatial neighbors stay
    within each core and 50 micrometers.
  - All 407659 cells, three encoders, resolutions 0.5/1.0/1.5 at Leiden seed 0 and
    seed 1 at resolution 1.0 retained; no favorable-method, seed or resolution selection.
  - Synthetic planted-cluster, frozen-fit and spatial-isolation checks; exact serial
    versus concurrent Leiden equivalence tested before the scheduling-only retry.
  - Mean approximate-neighbor recall checked against exact neighbors on 256 queries
    per method; all pass the prespecified 0.90 gate. Actual neighbor arrays/distances
    retained for fixed-graph replay.
  - Twenty within-core label permutations preserve core cluster counts while breaking
    spatial label arrangement; report their mean separately from observed spatial
    agreement.
  - Input manifest/PCA checksums and coordinates verified; saved embeddings and every
    Leiden column independently reopened and checked for finite values, shape, integer
    labels and aligned row_index; portable report images verified.
  remaining_uncertainty: All-cell graphs and clustering are transductive despite training-only
    encoder fitting. Only one encoder seed and two Leiden seeds on one graph realization
    are available. Seed sensitivity is moderate and graph/resolution sensitivity is
    not biological validation. Shared PCA32 retains 8.21994 percent of Pearson-feature
    variance; kernel PCA also approximates the cohort using 512 training landmarks.
    Parallel HNSW insertion is nondeterministic; high mean recall does not imply every
    query has exact neighbors. Slide and tissue composition are confounded. Spatial
    smoothing, segmentation spillover and unmodeled tissue barriers can create apparent
    domains; 266 isolated cells use their own features. No independent cell-type labels,
    sealed generalization test, patient replication or orthogonal biological validation
    was performed.
  maximum_defensible_claim: Reusable normalized-expression and local-context embeddings
    and their Leiden partitions have been produced and numerically verified for all
    mapped SO1/SO2 cells. The methods give overlapping but different exploratory partitions
    with measured algorithmic seed sensitivity. These outputs do not establish validated
    cell identities, biological superiority, batch removal, predictive gain, cell-cell
    communication or causality.
evidence:
  predictive_gain:
    status: not_tested
    summary: No masked-expression prediction, trained-model comparison or graph-specific
      predictive-gain evaluation.
  stability:
    status: mixed
    summary: Fixed-graph Leiden seed ARI is 0.706129 for PCA, 0.697725 for kernel
      PCA and 0.825291 for spatial PCA. These indicate nonidentical partitions and
      moderate seed sensitivity; no method is declared biologically better from seed
      ARI. Resolution and cross-method partitions also differ.
  faithfulness:
    status: not_applicable
    summary: No learned attribution, sensitivity or inferred interaction is interpreted;
      numerical verification is not attribution faithfulness.
  null_calibration:
    status: mixed
    summary: Observed same-cluster spatial-edge agreement exceeds the mean of twenty
      within-core label permutations for all methods (PCA 0.294657 versus 0.171974;
      kernel 0.295648 versus 0.161363; spatial 0.476371 versus 0.241628). This descriptive
      composition-preserving null does not remove imposed smoothing, tissue confounding
      or spillover and supplies no biological validation.
  patient_replication:
    status: not_tested
    summary: The fixed donor split restricts encoder fitting, but all-cell partitioning
      is transductive; no independent-patient replication or held-out clustering generalization
      was tested.
  external_support:
    status: not_tested
    summary: Method references motivate computation only; no independent annotations,
      external cohort or orthogonal molecular support.
  perturbation_support:
    status: not_tested
    summary: Synthetic implementation checks and label permutations are not controlled
      biological perturbations.
