method:
  name: Matched SO2 GeneMAE masking comparison
  model_family: Dual-path GeneMAE
  graph_context: Spatial k15 union, Gaussian distance feature, coordinate-only tiles
    of at most 7000 cells
  masking_or_perturbation: 10% whole cells, 10% entries per cell, or contiguous 10%
    cell blocks; all-gene masking for hidden cells
  evaluation_design: All 14 cores fitted; 3 seeds per method, 200 epochs; identical
    3 replicates per evaluation task; equal-core aggregation
  implementation_version: held_in_so2_genemae_masking_v1; executed source and configs
    preserved in each run
conclusion:
  question: How does whole-cell reconstruction compare with gene-entry and spatial-block
    masking?
  estimand: Three separately reported fitted-cohort masked log1p-count reconstruction
    tasks
  observed_result: Whole-cell-trained GeneMAE has equal-core Huber 0.038705 on fixed
    10% whole-cell masks, 7.93% improvement over visible per-gene means; 14/14 cores
    and 3/3 seeds favor it. The prespecified reconstruction baseline gate is supported.
    On the same whole-cell evaluation masks, whole-cell training has 21.86% lower
    Huber than training with individual genes masks; 11.08% lower Huber than training
    with spatial block masks. The all-zero predictor has lower MAE (0.099643 versus
    0.148733); its Huber is 0.050397 and MSE 0.112680, compared with model MSE 0.079474.
    This metric disagreement makes the primary loss and positive-expression errors
    important to interpretation. All nine models completed 200 training epochs. Seven
    original runs passed all execution checks; individual-gene seeds 1 and 2 failed
    the final exact CPU replay/invariance assertion. Independent fresh CPU replay
    and hidden-target checks passed, but full evaluation replays failed the prespecified
    numerical agreement gate only for median gene-wise Pearson (maximum differences
    6.24e-7 and 7.36e-7). The strict gate remains failed; the nine-run verification
    criterion is not met. All seeds remain in this explicitly descriptive comparison,
    using their original recorded evaluations. Reconstruction loss replay differences
    and every secondary metric discrepancy are retained in replay_audit.json. The
    overall campaign outcome is inconclusive under its full verification contract;
    the narrower whole-cell baseline result is supported.
  strongest_alternative_explanation: Sparsity, cell identity, regional fields and
    segmentation spillover rather than useful cell interactions
  controls:
  - Visible gene mean, zero and neighbor mean
  - Identical evaluation masks across all nine models
  - Frozen model graph relabeling and self-edge-only ablation on whole-cell masks
  - Synthetic neighbor-smoothing recovery, constant-profile model optimization and
    hidden-target invariance checks; no planted biological interaction recovery claim
  remaining_uncertainty: Sparsity, broad spatial fields, cell identity and segmentation
    spillover remain alternative explanations. Visible means, neighbor smoothing and
    frozen-model graph ablations address some shortcuts but do not replace trained
    matched self/morphology/regional controls. Node-label permutation is not a confounder-preserving
    biological null. No patient-held-out split, population interval, calibration,
    biological mechanism or causal effect is established. All uncertainty bars describe
    technical seed variability only. Training masks are shared across seeds within
    each method, while initialization, dropout and traversal order vary with seed.
    Tiling removes cross-tile edges and may especially limit block reconstruction.
    Equal epoch budgets visit every tile; spatial-block tiles without targets skip
    optimization, so optimizer-step counts differ. Pooled Pearson can reflect differences
    in average abundance between genes; mean gene-wise Pearson is reported separately.
    The full tables expose positive and zero errors, undefined correlations and core
    heterogeneity.
  maximum_defensible_claim: Descriptive matched reconstruction comparison within the
    fitted SO2 cohort, conditional on the specified architecture, masks and training
    budget
evidence:
  predictive_gain:
    status: not_tested
    summary: Patient-held-out graph-specific gain is not tested; the narrower fitted-cohort
      whole-cell baseline gate is supported
  stability:
    status: mixed
    summary: All three seeds and masks reported; individual-gene seeds1/2 fail strict
      numerical replay in median gene Pearson; graph, segmentation and independent-patient
      robustness untested
  faithfulness:
    status: not_tested
    summary: Graph-use ablations are diagnostic; no attribution faithfulness study
  null_calibration:
    status: not_tested
    summary: Topology-preserving label permutation does not preserve biological confounders
  patient_replication:
    status: not_tested
    summary: All fourteen cores belong to fitting; no independent patient test
  external_support:
    status: not_tested
    summary: No orthogonal validation
  perturbation_support:
    status: not_tested
    summary: No biological perturbation
