result_id: res_so12_pearson_preprocessing_plausibility
title: Pearson preprocessing passes a joint-slide donor-separated plausibility pilot
status: verified
outcome: supported
experiment_type: data_qc
method_family: pearson_preprocessing
lifecycle_stage: pilot
study_axis: preprocessing
campaign_ids:
- cmp_20261016_so12_pearson_preprocessing
method:
  name: Pooled training-fitted quasi-Poisson Pearson preprocessing comparison
  model_family: No neural model; fixed preprocessing, PCA and diagnostic logistic
    classifiers
  graph_context: No new graph or cross-core edges; source independent core graphs
    referenced
  masking_or_perturbation: Fully observed expression; synthetic heldout and hidden-gene
    perturbation checks only
  evaluation_design: 10 training donors, 4 diagnostic donors, 28 cores; 1000 sampled
    cells/core; all training cells fit transforms/PCA; one seed and one split
  implementation_version: so12_quasipoisson_v1; vendor-source pin 41c499026d789ff35288de2ddc62f506a9d51cf0;
    common PCA recentered after clipping
conclusion:
  question: Is pooled Pearson, with or without signed log, plausible shared preprocessing
    for SO1 and SO2?
  estimand: Descriptive depth association and circular vendor-annotation consistency
    in heldout donors
  observed_result: 'Heldout-core median variance-weighted PC/depth R²: raw log 0.3720763,
    CP10k log 0.3260569, Pearson 0.0330754, signed-log Pearson 0.0307229. Pearson
    improves all eight heldout cores. SO1/SO2 balanced annotation accuracy: raw log
    0.706224/0.734916, CP10k log 0.678751/0.729620, Pearson 0.716627/0.760118, signed-log
    Pearson 0.736762/0.726686. Both Pearson variants pass the fixed no-more-than-0.05
    within-slide loss criterion. Extra signed log improves depth in only four of eight
    cores relative to Pearson. All output features finite.'
  strongest_alternative_explanation: Depth can encode biology; compression changes
    PC variance weighting; vendor labels derive from expression; slide and disease
    composition are confounded.
  controls:
  - Training-only pooled fitting; verified donor-disjoint split; all 28 core count/metadata
    alignment checks.
  - Raw-log and CP10k-log baselines; nonstandard signed-log ablation; same balanced
    per-core sample and 32-PC protocol.
  - Independent CPU formula and GPU comparison, heldout perturbation fit invariance,
    synthetic class/depth recovery.
  - Within-training-core annotation permutation null; QC-pass depth sensitivity; independent
    exported-array replay and checksums.
  remaining_uncertainty: No neural training or batch-removal validation; only four
    diagnostic donors, one split/seed; vendor letters have unverified biological meanings;
    no external or independent biological validation. Full-cell totals leak hidden
    counts if masking is applied afterward.
  maximum_defensible_claim: Both Pearson variants are plausible fully observed shared
    preprocessing candidates; prefer plain Pearson as the next training baseline and
    retain signed log as an ablation. This does not establish batch correction, improved
    masked prediction or preserved biological mechanisms.
evidence:
  predictive_gain:
    status: not_tested
    summary: No masked-expression or neural graph model comparison.
  stability:
    status: mixed
    summary: Pearson versus raw log improves depth in all eight cores and QC-pass
      subset; extra signed-log benefit occurs in four of eight cores; no split/seed
      replication.
  faithfulness:
    status: not_applicable
    summary: No model attribution or inferred interaction tested.
  null_calibration:
    status: mixed
    summary: One within-training-core label permutation produces lower agreement than
      observed labels, but is not a calibrated significance test.
  patient_replication:
    status: not_tested
    summary: Four heldout donor groups provide descriptive consistency only; no independent
      cohort or confirmatory replication.
  external_support:
    status: not_tested
    summary: Vendor method source supports implementation, not independent biological
      validation.
  perturbation_support:
    status: not_tested
    summary: Synthetic numerical controls only; no biological intervention.
