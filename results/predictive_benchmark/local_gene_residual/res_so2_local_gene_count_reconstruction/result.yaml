schema_name: bagm_result_record
schema_version: 1
revision: 1
result_id: res_so2_local_gene_count_reconstruction
title: Simple local gene corrections improve count RMSE but miss the prespecified
  NLL margin
status: verified
outcome: negative
experiment_type: predictive_benchmark
method_family: local_gene_residual
lifecycle_stage: exploratory_validation
study_axis: simple_count_reconstruction
campaign_ids:
- cmp_20261004_local_gene_residual
method:
  name: Local Gene Residual count reconstruction
  model_family: Two-layer MLP with gene-wise local residuals and hurdle NB2 output
  graph_context: Up to 16 clean non-self nearest neighbors within 75 micrometers;
    same-gene log1p mean and positive fraction; self-only control
  masking_or_perturbation: Inherited target-isolated Uniform1..1000 gene masking with
    identical fixed validation masks
  evaluation_design: 'Four fixed-budget 32-epoch runs: local/self crossed with seeds0/1;
    lowest-NLL checkpoint selection; terminal epochs29..32; two cores from one held-out
    donor; historical NB/hurdle endpoints'
  implementation_version: 866313cb473549e834fbd7d0809c60a27cbb3c3a plus checksummed
    source snapshots in every run
conclusion:
  question: Can a simple new count model improve reconstruction over BAGM, and does
    direct local gene evidence help?
  estimand: Partial-gene reconstruction from visible target genes, permitted covariates
    and clean non-self neighbors on the existing held-out validation donor
  observed_result: Across both local seeds, selected NLL=0.326651015, MAE=0.223390653,
    RMSE=1.100784904; historical hurdle NLL=0.328241753, MAE=0.225991939, RMSE=1.168484806.
    NLL improved by 0.001590738, below the prespecified 0.002 margin; the full practical
    criterion did not pass. RMSE improved 5.794% and MAE 1.151%. Local context improves
    NLL over matched self-only controls in both seeds and both cores. All four runs
    completed and replayed.
  strongest_alternative_explanation: Historical optimization and stopping differ;
    reused validation data and donor-specific local copying or segmentation effects
    can explain gains without general patient-level improvement.
  controls:
  - Matched self-only controls in both seeds
  - Train-only gene constants and always-zero MAE reference
  - Exact inherited splits and masks; self-exclusion and hidden-value invariance tests
  - All-seed reporting, fixed budget, checkpoint replay and immutable bundle checks
  remaining_uncertainty: One validation donor, no sealed test set; two optimizer seeds;
    no spatial-block, segmentation-perturbation, realistic-null, independent patient
    or causal evaluation. The .002 primary improvement criterion failed.
  maximum_defensible_claim: On this reused validation split the simpler model lowers
    NLL, MAE and RMSE versus the historical hurdle endpoint; its local component adds
    paired predictive value. A material .002 NLL gain and independent generalization
    are not established.
evidence:
  predictive_gain:
    status: mixed
    summary: Both local seeds improve historical NLL and RMSE and beat their self-only
      controls; the prespecified .002 mean NLL margin does not pass.
  stability:
    status: supported
    summary: Direction of local-versus-self NLL gain agrees in both seeds and both
      cores of one donor; wider stability was not tested.
  faithfulness:
    status: not_tested
    summary: Ablation tests predictive contribution; no attribution faithfulness analysis.
  null_calibration:
    status: not_tested
    summary: No mechanism-breaking spatial nulls were run.
  patient_replication:
    status: not_tested
    summary: One held-out donor is available; two cores are not independent donor
      replication.
  external_support:
    status: not_tested
    summary: No external cohort or molecular support evaluated.
  perturbation_support:
    status: not_tested
    summary: No controlled biological perturbations evaluated.
