result_id: res_so12_pearson_random_mask_validation
title: SO1 + SO2 random-mask QKV validation against constant baselines
status: verified
outcome: inconclusive
experiment_type: predictive_benchmark
method_family: relative_qkv
lifecycle_stage: exploratory_screen
study_axis: so12_donor_held_out_validation
campaign_ids:
- cmp_20261016_so12_pearson_relative_qkv_train_validation
method:
  name: Four-layer Relative-Geometric QKV with integrated Pearson targets
  model_family: relative_geometry_qkv_graph_transformer
  graph_context: Coordinate-only within-core radial-stratified k200/r500-um graphs; four independent
    256-wide blocks and eight heads; permitted train-normalized morphology; no cross-core or slide
    edges.
  masking_or_perturbation: Independent uniform integer 0–1000 masked genes per cell; ten fresh training
    views per core/epoch and three fixed validation views; visible-count-only normalized inputs; full-observation
    targets used only for supervision.
  evaluation_design: 'Prespecified seed 0, fold 0 fixed donor split: 20 training cores/10 donor groups
    and eight validation cores/four other donor groups. Strict best equal-core masked Huber selects
    epoch 151. Mean constants fit training targets only; zero and both means use identical validation
    masks. No sealed test.'
  implementation_version: so12_pearson_relative_qkv_train_validation_v1; observed_only_mask_adapter_v1;
    exact source hashes and dirty execution commit in immutable training_start.json and provenance/git.json.
conclusion:
  question: Does the completed joint-slide four-layer model improve masked integrated Pearson reconstruction
    over zero and training-only per-gene means?
  estimand: Partial-gene masked standardized Pearson-feature reconstruction on the existing donor-separated
    exploratory validation split; primary equal-core Huber, with pooled error and correlation diagnostics.
  observed_result: 'Completed epoch 151 is the strict best checkpoint: equal-core Huber 0.1961138961,
    pooled MAE 0.3081599538, MSE 1.0058877300 and Pearson 0.1344985527. Huber falls 6.33%, 6.72% and
    6.21% versus zero, equal-core training mean and equal-cell training mean, respectively, with improvements
    in all eight validation cores against each. MAE falls 26.79–28.16%, but MSE is 0.58–0.70% worse.
    Outcome is mixed across metrics; the schema outcome is inconclusive. All prespecified seed/fold
    work is complete, not an interim best-seed selection.'
  strongest_alternative_explanation: Per-gene robust locations and observed same-cell expression may
    explain the gains without graph-specific information. Huber optimization favors different predictions
    from squared-error-optimal means; validation selection may inflate apparent gains.
  controls:
  - Frozen zero-standardized-Pearson and per-gene training-only equal-core and equal-cell means; validation
    never fits constants.
  - Exact shared target manifest, split, source/configuration binding and 24 fixed mask receipts covering
    159816944 entries; independently reproduced equal-core baseline to 1e-8.
  - Donor-disjoint split, train-fitted normalization, visible-count-only masked inputs and hidden-count
    invariance gate; morphology and graph inputs exclude target-derived labels and totals.
  - Completed-run checkpoint reload and final validation replay, immutable bundle checksums, complete
    seed/fold coverage and retained startup failure.
  remaining_uncertainty: Single prespecified seed, four validation donors, no sealed independent test
    or uncertainty interval. Validation was previously used for preprocessing diagnostics and then
    checkpoint selection. Eight core wins do not establish independent patient replication. Pooled
    Pearson is weak and is not gene-wise correlation. Robust constant, cell-autonomous and graph-ablation
    controls, seed stability, faithfulness, biological null calibration, external replication and
    perturbation support remain untested.
  maximum_defensible_claim: On this completed exploratory split, the selected model has lower masked
    Pearson-feature Huber and MAE than the three specified constant baselines and slightly worse MSE.
    This does not establish graph-specific gain, biological integration or mechanism, independent-test
    generalization, patient replication or causality.
evidence:
  predictive_gain:
    status: mixed
    summary: Lower Huber and MAE versus all three constants, Huber wins in eight of eight cores; MSE
      worsens and pooled Pearson remains weak. Graph-specific predictive gain is untested.
  stability:
    status: not_tested
    summary: Only the single prespecified seed and fixed split were run; no seed, fold or graph robustness
      claim.
  faithfulness:
    status: not_tested
    summary: No attribution or mechanism-faithfulness experiment.
  null_calibration:
    status: not_tested
    summary: Constant predictors are predictive references; mechanism-breaking biological or spatial
      nulls were not run.
  patient_replication:
    status: not_tested
    summary: Four validation donors were used for preprocessing diagnostics and model selection; no
      locked patient replication study or independent cohort.
  external_support:
    status: not_tested
    summary: No independent external molecular or cohort evidence.
  perturbation_support:
    status: not_tested
    summary: No controlled perturbational evidence.
