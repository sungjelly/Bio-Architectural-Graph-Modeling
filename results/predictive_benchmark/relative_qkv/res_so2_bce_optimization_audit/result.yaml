schema_name: bagm_result_record
schema_version: 1
revision: 1
result_id: res_so2_bce_optimization_audit
title: SO2 BCE optimization audit at matched target exposure
status: verified
outcome: negative
experiment_type: predictive_benchmark
method_family: relative_qkv
lifecycle_stage: validation_confirmation
study_axis: optimization
campaign_ids:
- cmp_20261001_so2_bce_optimization_audit
method:
  name: Target-isolated binary-expression BCE optimization audit
  model_family: Geometry-modulated relative-QKV graph transformer
  graph_context: Unchanged clean within-core neighbor expression with permitted geometry
    and imaging/morphology
  masking_or_perturbation: Partial-gene per-cell masking; every training cell once
    per epoch; fixed validation masks
  evaluation_design: Exploratory grid and regularization screen, then fresh incumbent/comparator
    model seeds 0/1 at 32 epochs on one held-out donor group. Fold 0 denotes this
    single fixed split, not independent cross-validation folds.
  implementation_version: 866313cb473549e834fbd7d0809c60a27cbb3c3a
conclusion:
  question: Do the declared batch, learning-rate or regularization settings improve
    fixed-mask SO2 BCE prediction?
  estimand: Partial-gene binary-expression reconstruction from observed same-cell
    genes, imaging/morphology and permitted clean neighborhood context
  observed_result: "Across model seeds 0 and 1, the incumbent-minus-comparator reduction\
    \ in mean validation BCE at epochs 29\u201332 was 0.00005516 and 0.00031137; mean\
    \ reduction 0.00018326. The prespecified material-gain criterion was not met.\
    \ Endpoint convergence diagnostic: still improving in at least one run. Separately,\
    \ the eight-epoch target-window incumbent reduced BCE versus paired cores by 0.00719035,\
    \ with F1 change +0.03931919, at equal 1,669,568 target visits and 1,672 versus\
    \ 48 optimizer updates. This early update-regimen result is distinct from the\
    \ tuning comparison and does not establish eventual superiority."
  strongest_alternative_explanation: Validation selection and one-donor distribution
    may explain apparent gains; gene prevalence and observed same-cell features may
    explain prediction without useful spatial context.
  controls:
  - Complete batch/LR screen and single-factor dropout/weight-decay controls with
    immutable failed attempts retained
  - Fresh incumbent and comparator seeds0/1, fixed masks/order and equal target exposure;
    terminal mean chosen independently of best checkpoint
  - One-GPU paired-core reference, exact train-fitted gene prevalence validation reference
    and selected-best fixed-training diagnostics
  - Coverage, finite-gradient, resource, selected-best replay and artifact/checkpoint
    checksum gates
  remaining_uncertainty: Only one held-out validation donor, two optimization seeds,
    repeated validation selection and no sealed test. Exposure is matched; optimizer
    updates differ across batch sizes. At least one endpoint remains unconverged,
    so eventual-performance comparison is inconclusive. Graph-specific gain, attribution
    stability/faithfulness, biological nulls, patient replication and mechanism remain
    untested.
  maximum_defensible_claim: Exploratory validation-selected optimization behavior
    at the tested32-epoch budget on this split; no claim of global optimality, graph-specific
    information, independent patient replication or causality.
evidence:
  predictive_gain:
    status: failed
    summary: Prespecified optimization gain over the matched incumbent did not pass.
      This does not test graph-specific gain.
  stability:
    status: supported
    summary: Direction of optimization effect across two model seeds only; attribution
      and biological stability were not evaluated.
  faithfulness:
    status: not_tested
    summary: Not tested by this optimization audit.
  null_calibration:
    status: not_tested
    summary: Not tested by this optimization audit.
  patient_replication:
    status: not_tested
    summary: Not tested by this optimization audit.
  external_support:
    status: not_tested
    summary: Not tested by this optimization audit.
  perturbation_support:
    status: not_tested
    summary: Not tested by this optimization audit.
