[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bagm"
version = "0.1.0"
description = "Bio-Architectural Graph Modeling experiment and spatial benchmark infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "torch>=2.5",
  "torch-geometric>=2.6",
]

[project.optional-dependencies]
attention-niche-analysis = [
  "igraph>=0.11,<2",
  "leidenalg>=0.10,<1",
  "pyarrow>=17",
  "shapely>=2,<3",
]
embedding-analysis = [
  "faiss-cpu>=1.11,<2",
  "igraph>=0.11,<2",
  "leidenalg>=0.10,<1",
  "pyarrow>=17",
]
parquet = ["pyarrow>=17"]
test = ["pytest>=8"]

[project.scripts]
bagm = "spatial_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
